<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#080a14">
<title>역사 한 입 · 이야기로 배우는 한국사·세계사·교양</title>
<style>
:root{
  --bg:#07080f;
  --panel:#0e1122;
  --card:rgba(255,255,255,.055);
  --card2:rgba(255,255,255,.035);
  --line:rgba(255,255,255,.10);
  --line2:rgba(255,255,255,.16);
  --txt:#eef1ff;
  --dim:#98a1c0;
  --dim2:#6c7595;
  --gold:#ffce5c;
  --gold2:#ff9d4d;
  --kr:#ff8080;
  --wh:#5cc8ff;
  --gk:#b78dff;
  --ok:#3fe0a2;
  --no:#ff6b81;
  --radius:22px;
  --tab-h:70px;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{background:#05060c}
body{
  background:#05060c;
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  letter-spacing:-.01em;
}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit;user-select:none;-webkit-user-select:none;touch-action:manipulation}
h1,h2,h3,p{margin:0}
ul{margin:0;padding:0;list-style:none}

#app{
  position:relative;
  max-width:480px;
  margin:0 auto;
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(120% 60% at 50% -10%, #1a2044 0%, rgba(26,32,68,0) 60%),
    radial-gradient(90% 50% at 110% 30%, rgba(120,60,200,.18) 0%, rgba(120,60,200,0) 60%),
    radial-gradient(80% 45% at -10% 70%, rgba(255,120,60,.10) 0%, rgba(255,120,60,0) 60%),
    linear-gradient(180deg,#0c1024 0%,#080a16 45%,#06070f 100%);
  background-attachment:local;
  overflow:hidden;
  isolation:isolate;
}
#app::before{
  content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.085) 1px, transparent 1px);
  background-size:26px 26px;
  mask-image:linear-gradient(180deg,rgba(0,0,0,.5),transparent 55%);
  -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.5),transparent 55%);
  pointer-events:none;z-index:0;
}
#app::after{
  content:"";position:absolute;left:50%;top:-120px;width:420px;height:420px;transform:translateX(-50%);
  background:radial-gradient(circle,rgba(255,206,92,.16),transparent 65%);
  filter:blur(20px);pointer-events:none;z-index:0;
  animation:halo 9s ease-in-out infinite alternate;
}
@keyframes halo{from{opacity:.55;transform:translateX(-50%) scale(.95)}to{opacity:.95;transform:translateX(-50%) scale(1.08)}}

/* ---------- screens ---------- */
.screen{
  position:relative;z-index:1;
  display:none;flex:1;min-height:0;
  padding:0 18px calc(var(--tab-h) + 16px + env(safe-area-inset-bottom));
  overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.screen::-webkit-scrollbar{display:none}
.screen.active{display:block;animation:screenIn .32s cubic-bezier(.2,.85,.3,1)}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- hero ---------- */
.hero{padding:calc(16px + env(safe-area-inset-top)) 0 0}
.hero-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:.02em}
.logo .dot{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:13px;
  background:linear-gradient(150deg,var(--gold),var(--gold2));color:#231a05;box-shadow:0 4px 14px rgba(255,170,60,.35)}
.hello{color:var(--dim);font-size:13px;font-weight:600;margin-bottom:7px}
.hero-title{font-size:27px;line-height:1.28;font-weight:800;letter-spacing:-.04em}
.hero-title em{font-style:normal;background:linear-gradient(100deg,var(--gold) 10%,#ffb35c 55%,#ff7a8a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.badges{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:14px}
.title-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;
  font-size:11.5px;font-weight:700;color:var(--gold);background:rgba(255,206,92,.10);border:1px solid rgba(255,206,92,.28)}
.title-badge.empty{color:var(--dim);background:rgba(255,255,255,.05);border-color:var(--line)}
.streak-chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:99px;font-size:11.5px;font-weight:700;
  color:#ffcbae;background:rgba(255,120,80,.12);border:1px solid rgba(255,140,90,.24)}

.section-label{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 11px}
.section-label h2{font-size:12.5px;font-weight:800;color:var(--dim);letter-spacing:.06em}
.section-label .hint{font-size:11px;color:var(--dim2);font-weight:700}

/* ---------- category tabs ---------- */
.seg{display:flex;gap:4px;margin:0 0 14px;padding:4px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.seg button{flex:1;padding:10px 4px;border-radius:11px;font-size:12.5px;font-weight:800;color:var(--dim);transition:.18s}
.seg button.on{background:rgba(255,255,255,.12);color:var(--txt);box-shadow:0 2px 10px rgba(0,0,0,.3)}
.seg button .cn{font-size:10px;font-weight:700;color:var(--dim2);margin-left:3px}
.seg button.on .cn{color:var(--gold)}

.catprog{display:flex;align-items:center;gap:10px;margin:0 2px 12px}
.catprog .pt{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.catprog .pf{height:100%;border-radius:99px;background:linear-gradient(90deg,#ffd979,#ff9d5c);transition:width .5s}
.catprog span{font-size:11px;font-weight:800;color:var(--dim2);white-space:nowrap}

/* ---------- chapter list ---------- */
.chapter{
  display:flex;gap:13px;align-items:center;width:100%;text-align:left;
  padding:14px;border-radius:20px;background:var(--card);border:1px solid var(--line);
  margin-bottom:9px;transition:transform .14s ease,border-color .2s;
}
.chapter:active{transform:scale(.985)}
.chapter .em{width:46px;height:46px;flex:0 0 46px;border-radius:15px;display:grid;place-items:center;font-size:22px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.06)}
.chapter .m{flex:1;min-width:0}
.chapter .no{font-size:10px;font-weight:800;color:var(--dim2);letter-spacing:.1em}
.chapter .tt{display:block;font-size:15px;font-weight:800;margin:4px 0 4px;letter-spacing:-.025em;line-height:1.3}
.chapter .role{display:block;font-size:11.5px;color:var(--dim);line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chapter .st{margin-left:auto;flex:0 0 auto;text-align:right;font-size:10px;font-weight:800;color:var(--dim2)}
.chapter .st .stars{display:block;font-size:11px;letter-spacing:1px;color:var(--gold);margin-bottom:3px}
.chapter.k{border-color:rgba(255,128,128,.20);background:linear-gradient(150deg,rgba(255,128,128,.10),rgba(255,128,128,.015) 70%)}
.chapter.w{border-color:rgba(92,200,255,.20);background:linear-gradient(150deg,rgba(92,200,255,.10),rgba(92,200,255,.015) 70%)}
.chapter.g{border-color:rgba(183,141,255,.20);background:linear-gradient(150deg,rgba(183,141,255,.10),rgba(183,141,255,.015) 70%)}
.chapter.cleared{border-color:rgba(63,224,162,.34);background:linear-gradient(150deg,rgba(63,224,162,.13),rgba(63,224,162,.02) 70%)}
.chapter.cleared .em{background:rgba(63,224,162,.14);border-color:rgba(63,224,162,.3)}
.chapter .go{width:24px;flex:0 0 24px;font-size:14px;color:var(--dim2);text-align:center}

/* ---------- secondary cards ---------- */
.mini{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:15px 16px;border-radius:20px;
  background:var(--card2);border:1px solid var(--line);margin-bottom:9px;transition:transform .14s}
.mini:active{transform:scale(.985)}
.mini .em{font-size:22px;width:30px;text-align:center;flex:0 0 30px}
.mini .t{flex:1;min-width:0}
.mini .t b{display:block;font-size:14.5px;font-weight:800;letter-spacing:-.02em}
.mini .t span{display:block;font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.4}
.mini .go{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:grid;place-items:center;font-size:13px;
  background:rgba(255,255,255,.07);border:1px solid var(--line2);color:var(--dim)}
.mini.gold{border-color:rgba(255,206,92,.26);background:linear-gradient(120deg,rgba(255,206,92,.12),rgba(255,206,92,.02) 60%),var(--card2)}
.mini.gold .go{color:var(--gold);background:rgba(255,206,92,.12);border-color:rgba(255,206,92,.35)}
.mini.red{border-color:rgba(255,107,129,.26);background:linear-gradient(120deg,rgba(255,107,129,.13),rgba(255,107,129,.02) 60%),var(--card2)}
.mini.red .go{color:#ffc2cb;background:rgba(255,107,129,.16);border-color:rgba(255,107,129,.35)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}
.stat{padding:14px 10px;border-radius:18px;background:var(--card2);border:1px solid var(--line);text-align:center}
.stat b{display:block;font-size:18px;font-weight:800;letter-spacing:-.02em}
.stat b small{font-size:10px;color:var(--dim2);font-weight:700}
.stat span{display:block;font-size:10.5px;color:var(--dim);margin-top:3px;font-weight:700}

/* ---------- story ---------- */
#screen-story{padding:0 18px calc(12px + env(safe-area-inset-bottom))}
#screen-story.active{display:flex;flex-direction:column;overflow:hidden}
.story-head{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 0 12px;flex:0 0 auto}
.icon-btn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:14px;
  color:var(--dim);background:rgba(255,255,255,.055);border:1px solid var(--line);flex:0 0 auto}
.icon-btn:active{transform:scale(.94)}
.story-mid{flex:1;min-width:0}
.story-mid b{display:block;font-size:11.5px;font-weight:800;color:var(--dim);letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story-mid span{display:block;font-size:10.5px;color:var(--dim2);font-weight:700;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story-count{font-size:11px;font-weight:800;color:var(--gold);padding:5px 9px;border-radius:8px;
  background:rgba(255,206,92,.1);border:1px solid rgba(255,206,92,.22);flex:0 0 auto;font-variant-numeric:tabular-nums}

.bars{display:flex;gap:5px;margin-bottom:14px;flex:0 0 auto}
.bar{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.11);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ffd979,#ff9d5c);transition:width .4s}
.bar.on i{width:100%}
.bar.cur i{width:100%;opacity:.75}
.bar.cur{background:rgba(255,255,255,.18)}

.stage{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;padding-bottom:2px;touch-action:pan-y}
.stage::-webkit-scrollbar{display:none}

.card{
  position:relative;overflow:hidden;
  border-radius:24px;padding:22px 20px 24px;
  background:linear-gradient(165deg,rgba(255,255,255,.075),rgba(255,255,255,.028));
  border:1px solid var(--line2);
  box-shadow:0 22px 44px -30px #000;
  animation:cardIn .38s cubic-bezier(.2,.85,.3,1);
}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
.card.rev{animation:cardBack .38s cubic-bezier(.2,.85,.3,1)}
@keyframes cardBack{from{opacity:0;transform:translateY(-14px) scale(.99)}to{opacity:1;transform:none}}
.card .wm{position:absolute;right:-8px;top:-12px;font-size:92px;line-height:1;opacity:.06;pointer-events:none}
.card .scene{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--gold);margin-bottom:12px}
.card .scene::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(255,206,92,.35),transparent)}
.card h2{font-size:22px;line-height:1.32;font-weight:800;letter-spacing:-.035em;margin-bottom:14px;word-break:keep-all}
.card .body{font-size:15.5px;line-height:1.82;color:#d7dcf0;word-break:keep-all}
.card .body p + p{margin-top:13px}
.hl{color:#ffe2a2;font-weight:800;background:linear-gradient(transparent 64%,rgba(255,206,92,.22) 64%);padding:0 1px}
.tip{margin-top:18px;padding:13px 14px;border-radius:15px;background:rgba(255,206,92,.065);border:1px solid rgba(255,206,92,.2)}
.tip b{display:flex;align-items:center;gap:5px;font-size:9.5px;font-weight:800;letter-spacing:.12em;color:var(--gold);margin-bottom:6px}
.tip span{display:block;font-size:12.5px;line-height:1.62;color:#eadfc4;word-break:keep-all}

.pick{margin-top:18px;padding-top:16px;border-top:1px dashed rgba(255,255,255,.14)}
.pick .pq{font-size:14px;font-weight:800;line-height:1.45;margin-bottom:11px;letter-spacing:-.02em;word-break:keep-all}
.pick button{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:13px 14px;margin-bottom:8px;
  border-radius:15px;font-size:13.5px;line-height:1.5;font-weight:600;color:var(--txt);
  background:rgba(255,255,255,.045);border:1px solid var(--line);transition:.16s;word-break:keep-all}
.pick button .k{flex:0 0 20px;width:20px;height:20px;border-radius:7px;display:grid;place-items:center;font-size:10px;
  font-weight:800;color:var(--dim);background:rgba(255,255,255,.09);margin-top:1px}
.pick button:active{transform:scale(.985)}
.pick button.sel{border-color:rgba(255,206,92,.6);background:rgba(255,206,92,.1)}
.pick button.sel .k{background:var(--gold);color:#241a05}
.pick button.dimmed{opacity:.42}
.pick .rev{margin-top:11px;padding:13px 14px;border-radius:14px;font-size:12.5px;line-height:1.66;
  background:rgba(92,200,255,.075);border:1px solid rgba(92,200,255,.24);color:#cfe7fb;word-break:keep-all}
.pick .rev b{display:block;font-size:9.5px;font-weight:800;letter-spacing:.12em;color:#7fd3ff;margin-bottom:5px}
.pick .rev .mine{display:block;margin-bottom:6px;color:#a8b8d8;font-weight:700}

.cta-card{text-align:center;padding:30px 22px 28px}
.cta-card .big{font-size:46px;line-height:1;margin-bottom:16px;filter:drop-shadow(0 6px 18px rgba(255,180,70,.4))}
.cta-card h2{font-size:24px;margin-bottom:10px}
.cta-card p{font-size:13.5px;line-height:1.68;color:var(--dim);word-break:keep-all}
.cta-card .meta{display:flex;justify-content:center;gap:8px;margin-top:18px;flex-wrap:wrap}
.cta-card .meta span{font-size:11px;font-weight:800;color:#cfd6ef;padding:6px 11px;border-radius:9px;
  background:rgba(255,255,255,.06);border:1px solid var(--line)}
.cta-card .learned{margin-top:18px;padding-top:16px;border-top:1px dashed rgba(255,255,255,.13);
  font-size:12.5px;line-height:1.66;color:#d9c79c;text-align:left;word-break:keep-all}
.cta-card .learned b{display:block;font-size:9.5px;font-weight:800;letter-spacing:.12em;color:var(--gold);margin-bottom:6px}

.story-foot{display:flex;gap:9px;padding-top:12px;flex:0 0 auto}
.btn-primary{
  display:flex;align-items:center;justify-content:center;gap:7px;
  min-height:52px;border-radius:16px;font-size:15.5px;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(135deg,#ffd979,#ffab4d);color:#241a05;
  box-shadow:0 10px 24px -10px rgba(255,180,70,.85);
  transition:transform .15s ease;
  padding:0 18px;
}
.btn-primary:active{transform:scale(.975)}
.btn-primary.dim{background:rgba(255,255,255,.1);color:var(--dim);box-shadow:none;border:1px solid var(--line)}
.btn-ghost{min-height:52px;padding:0 17px;border-radius:16px;font-size:13.5px;font-weight:700;color:var(--txt);
  background:rgba(255,255,255,.07);border:1px solid var(--line);flex:0 0 auto}
.btn-ghost:disabled{opacity:.35}
.story-foot .btn-primary{flex:1}
.story-foot .btn-ghost{min-width:88px}

/* ---------- quiz ---------- */
#screen-quiz{padding:0 16px calc(12px + env(safe-area-inset-bottom))}
#screen-quiz.active{display:flex;flex-direction:column;overflow:hidden}
.quiz-head{display:flex;align-items:center;gap:11px;padding:calc(14px + env(safe-area-inset-top)) 2px 10px;flex:0 0 auto}
.progress-track{flex:1;height:7px;border-radius:99px;background:rgba(255,255,255,.085);overflow:hidden}
.progress-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ffd979,#ff9d5c);
  transition:width .35s cubic-bezier(.2,.8,.3,1)}
.hud-score{font-size:13.5px;font-weight:800;color:var(--gold);min-width:40px;text-align:right;font-variant-numeric:tabular-nums}
.quiz-sub{display:flex;align-items:center;gap:8px;padding:0 2px 10px;min-height:26px;flex:0 0 auto}
.chip{font-size:11px;font-weight:800;padding:5px 9px;border-radius:8px;background:rgba(255,255,255,.07);
  border:1px solid var(--line);color:#cfd6ef;max-width:62%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.k{color:#ffb3b3;background:rgba(255,128,128,.12);border-color:rgba(255,128,128,.3)}
.chip.w{color:#a9e2ff;background:rgba(92,200,255,.12);border-color:rgba(92,200,255,.3)}
.chip.g{color:#d5c2ff;background:rgba(183,141,255,.12);border-color:rgba(183,141,255,.3)}
.hearts{margin-left:auto;font-size:13px;letter-spacing:2px;color:#ff8a9b;filter:drop-shadow(0 0 6px rgba(255,90,120,.5))}
.hearts .off{opacity:.22;filter:none}
.combo-badge{margin-left:auto;font-size:11.5px;font-weight:800;color:#ffc06a;padding:5px 9px;border-radius:8px;
  background:rgba(255,170,80,.13);border:1px solid rgba(255,170,80,.28);opacity:0;transform:scale(.8);transition:.2s}
.combo-badge.on{opacity:1;transform:none}
.combo-badge.pop{animation:pop .42s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.timer-track{height:3px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin:0 2px;opacity:0;transition:opacity .2s;flex:0 0 auto}
.timer-track.on{opacity:1}
.timer-fill{height:100%;width:100%;border-radius:99px;background:var(--ok)}
.timer-fill.warn{background:#ffbb55}
.timer-fill.danger{background:var(--no)}

.q-wrap{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:18px;overflow-y:auto;
  overscroll-behavior:contain;scrollbar-width:none}
.q-wrap::-webkit-scrollbar{display:none}
.q-index{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--dim2);margin-bottom:10px}
.q-index .lb{color:var(--gold);background:rgba(255,206,92,.1);border:1px solid rgba(255,206,92,.22);
  padding:4px 8px;border-radius:7px;letter-spacing:.06em}
.q-text{font-size:21px;line-height:1.46;font-weight:800;letter-spacing:-.035em;margin-bottom:20px;word-break:keep-all}
.choices{display:flex;flex-direction:column;gap:9px;padding-bottom:10px}
.choice{
  display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
  padding:15px 14px;border-radius:17px;font-size:14.5px;line-height:1.46;font-weight:600;
  color:var(--txt);background:rgba(255,255,255,.045);border:1px solid var(--line);
  transition:transform .13s ease,background .18s,border-color .18s,opacity .2s;
  word-break:keep-all;
}
.choice:active{transform:scale(.982);background:rgba(255,255,255,.08)}
.choice .key{flex:0 0 24px;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;
  font-size:11px;font-weight:800;color:var(--dim);background:rgba(255,255,255,.08);margin-top:-1px;transition:.18s}
.choice.correct{background:rgba(63,224,162,.15);border-color:rgba(63,224,162,.65);color:#d6fff0}
.choice.correct .key{background:rgba(63,224,162,.9);color:#04281c}
.choice.wrong{background:rgba(255,107,129,.14);border-color:rgba(255,107,129,.65);color:#ffdfe4}
.choice.wrong .key{background:rgba(255,107,129,.9);color:#2b0510}
.choice.dim{opacity:.4}
.ox-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-bottom:10px}
.ox{
  height:140px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:54px;font-weight:800;line-height:1;background:rgba(255,255,255,.045);border:1.5px solid var(--line);
  transition:transform .13s ease,background .2s,border-color .2s,opacity .2s;
}
.ox:active{transform:scale(.965)}
.ox small{font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--dim2);margin-top:6px}
.ox[data-v="O"]{color:var(--wh);background:radial-gradient(circle at 50% 35%,rgba(92,200,255,.17),rgba(92,200,255,.035));border-color:rgba(92,200,255,.32)}
.ox[data-v="X"]{color:#ff8d9d;background:radial-gradient(circle at 50% 35%,rgba(255,107,129,.17),rgba(255,107,129,.035));border-color:rgba(255,107,129,.32)}
.ox.correct{background:rgba(63,224,162,.2);border-color:rgba(63,224,162,.75);color:#8effcd;box-shadow:0 0 30px -8px rgba(63,224,162,.55)}
.ox.wrong{background:rgba(255,107,129,.2);border-color:rgba(255,107,129,.75)}
.ox.dim{opacity:.32}

.float-score{
  position:fixed;left:50%;top:32%;transform:translate(-50%,0);z-index:60;pointer-events:none;
  font-size:27px;font-weight:900;color:var(--gold);text-shadow:0 4px 18px rgba(255,170,60,.55);
  animation:floatUp 1s ease-out forwards;
}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}25%{opacity:1;transform:translate(-50%,-6px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}

/* ---------- feedback sheet ---------- */
.sheet{
  position:fixed;left:50%;bottom:0;z-index:70;width:100%;max-width:480px;
  transform:translate(-50%,106%);
  background:linear-gradient(180deg,#1a1e36 0%,#111426 55%,#0c0f1e 100%);
  border-radius:26px 26px 0 0;border:1px solid var(--line2);border-bottom:0;
  padding:10px 18px calc(14px + env(safe-area-inset-bottom));
  box-shadow:0 -24px 60px -12px rgba(0,0,0,.8);
  transition:transform .38s cubic-bezier(.2,.9,.25,1);
  max-height:76vh;
  max-height:76dvh;display:flex;flex-direction:column;
}
.sheet.show{transform:translate(-50%,0)}
.sheet .grab{width:36px;height:4px;border-radius:99px;background:rgba(255,255,255,.2);margin:3px auto 13px;flex:0 0 auto}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:11px;flex:0 0 auto}
.res-ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:0 0 auto}
.res-ico.ok{background:rgba(63,224,162,.16);color:var(--ok);border:1px solid rgba(63,224,162,.4)}
.res-ico.no{background:rgba(255,107,129,.16);color:var(--no);border:1px solid rgba(255,107,129,.4)}
.sheet-head .tt{font-size:16.5px;font-weight:800;letter-spacing:-.02em}
.sheet-head .tt small{display:block;font-size:11px;font-weight:600;color:var(--dim);margin-top:2px}
.sheet-head .pts{margin-left:auto;font-size:15px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:0;padding-right:2px}
.sheet-body::-webkit-scrollbar{width:0}
.ex-label{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--gold);
  padding:4px 8px;border-radius:7px;background:rgba(255,206,92,.1);border:1px solid rgba(255,206,92,.22);margin-bottom:8px}
.ex-text{font-size:14px;line-height:1.68;color:#d9def2;word-break:keep-all;margin-bottom:13px}
.ex-answer{font-size:12px;color:var(--dim);margin-bottom:9px;font-weight:600;line-height:1.6}
.ex-answer b{color:#d7e3ff}
.ex-answer s{color:var(--no);text-decoration:none}
.btn-next{
  width:100%;min-height:52px;border-radius:16px;font-size:15.5px;font-weight:800;
  background:linear-gradient(135deg,#ffd979,#ffab4d);color:#241a05;flex:0 0 auto;margin-top:6px;
  box-shadow:0 10px 24px -12px rgba(255,180,70,.9);
}
.btn-next:active{transform:scale(.985)}

/* ---------- result / chapter clear ---------- */
.res-wrap{padding:calc(24px + env(safe-area-inset-top)) 0 0;text-align:center}
.res-kicker{font-size:10.5px;font-weight:800;letter-spacing:.2em;color:var(--dim2)}
.res-score{font-size:58px;font-weight:900;letter-spacing:-.05em;line-height:1.05;margin:6px 0 2px;
  background:linear-gradient(120deg,#fff2c9,#ffce5c 45%,#ff9d5c);-webkit-background-clip:text;background-clip:text;color:transparent;
  font-variant-numeric:tabular-nums}
.res-score small{font-size:16px;letter-spacing:0;margin-left:3px;-webkit-text-fill-color:var(--dim);color:var(--dim)}
.res-mode{font-size:12.5px;color:var(--dim);font-weight:600}
.record{display:inline-flex;align-items:center;gap:6px;margin:12px 3px 0;padding:6px 13px;border-radius:99px;
  font-size:11.5px;font-weight:800;color:#1d1503;background:linear-gradient(120deg,#ffe08a,#ffb35c);
  box-shadow:0 8px 22px -10px rgba(255,180,80,.9);animation:recordIn .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes recordIn{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:22px 0 6px}
.res-cell{padding:13px 8px;border-radius:17px;background:var(--card2);border:1px solid var(--line)}
.res-cell b{display:block;font-size:18px;font-weight:800;letter-spacing:-.02em}
.res-cell span{display:block;font-size:10px;color:var(--dim);margin-top:4px;font-weight:700}
.res-cell b.ok{color:var(--ok)}
.res-actions{display:flex;gap:9px;margin-top:20px}
.res-actions .btn-primary{flex:1.5}
.res-actions .btn-ghost{flex:1;min-width:0}
.res-note{margin-top:14px;font-size:12px;color:var(--dim2);line-height:1.55;min-height:16px}
.unlocked{margin-top:16px;text-align:left;padding:14px 15px;border-radius:17px;
  background:linear-gradient(130deg,rgba(255,206,92,.13),rgba(255,206,92,.03));border:1px solid rgba(255,206,92,.28)}
.unlocked .h{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--gold);margin-bottom:7px}
.unlocked .a{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;padding:3px 0}

.clear-wrap{padding:calc(26px + env(safe-area-inset-top)) 0 0;text-align:center}
.clear-kicker{font-size:10px;font-weight:800;letter-spacing:.28em;color:var(--gold)}
.clear-badge{width:96px;height:96px;margin:14px auto 0;border-radius:50%;display:grid;place-items:center;
  font-size:13px;font-weight:900;letter-spacing:.08em;color:#241a05;
  background:linear-gradient(150deg,#ffe9a8,#ffb85c 55%,#ff9d4d);
  box-shadow:0 16px 40px -14px rgba(255,180,70,.85),inset 0 0 0 4px rgba(255,255,255,.35);
  animation:badgeIn .7s cubic-bezier(.2,1.5,.4,1)}
.clear-badge.miss{background:rgba(255,255,255,.08);border:1px solid var(--line2);color:var(--dim);box-shadow:none;font-size:12px}
@keyframes badgeIn{0%{transform:scale(.5) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
.clear-badge .em{font-size:30px;display:block;margin-bottom:-2px}
.stars-big{margin:14px 0 2px;font-size:26px;letter-spacing:5px;color:var(--gold);text-shadow:0 4px 16px rgba(255,180,70,.45)}
.stars-big .off{color:rgba(255,255,255,.16);text-shadow:none}
.clear-title{font-size:20px;font-weight:800;letter-spacing:-.03em;margin-top:10px;line-height:1.4;word-break:keep-all}
.clear-sub{font-size:12px;color:var(--dim);font-weight:600;margin-top:6px}
.clear-learned{margin:18px 0 0;padding:15px 16px;border-radius:17px;text-align:left;font-size:13px;line-height:1.68;
  color:#e2d4b4;background:linear-gradient(130deg,rgba(255,206,92,.11),rgba(255,206,92,.02));border:1px solid rgba(255,206,92,.22);word-break:keep-all}
.clear-learned b{display:block;font-size:9.5px;font-weight:800;letter-spacing:.12em;color:var(--gold);margin-bottom:6px}

/* ---------- collection ---------- */
.page-head{padding:calc(18px + env(safe-area-inset-top)) 0 4px}
.page-head h1{font-size:25px;font-weight:800;letter-spacing:-.04em}
.page-head p{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.5}
.empty{text-align:center;padding:46px 20px;color:var(--dim)}
.empty .i{font-size:38px;display:block;margin-bottom:12px;opacity:.85}
.empty b{display:block;font-size:14.5px;color:#cfd6ef;margin-bottom:6px;font-weight:800}
.empty span{font-size:12.5px;line-height:1.6;display:block}

.wrong-item{padding:14px 15px;border-radius:17px;background:var(--card2);border:1px solid var(--line);margin-bottom:9px}
.wrong-item .top{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.wrong-item .cat{font-size:10px;font-weight:800;padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.07);color:var(--dim)}
.wrong-item .cat.k{color:#ffb3b3;background:rgba(255,128,128,.13)}
.wrong-item .cat.w{color:#a9e2ff;background:rgba(92,200,255,.13)}
.wrong-item .cat.g{color:#d5c2ff;background:rgba(183,141,255,.13)}
.wrong-item .cnt{margin-left:auto;font-size:10px;color:var(--dim2);font-weight:700}
.wrong-item .q{font-size:14px;font-weight:700;line-height:1.48;margin-bottom:9px;word-break:keep-all}
.wrong-item .ans{font-size:11.5px;line-height:1.6;color:var(--dim)}
.wrong-item .ans b{color:var(--ok);font-weight:700}
.wrong-item .ans s{color:var(--no);text-decoration:none}
.wrong-item .ex{font-size:12px;line-height:1.62;color:#b9c2dd;margin-top:7px;padding-top:8px;border-top:1px dashed rgba(255,255,255,.09);word-break:keep-all}
.wrong-head{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.wrong-head .n{font-size:12px;color:var(--dim);font-weight:700}
.wrong-head .btn-ghost{margin-left:auto;min-height:36px;height:36px;padding:0 12px;border-radius:11px;font-size:11.5px}

.title-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.title-card{padding:13px;border-radius:16px;background:var(--card2);border:1px solid var(--line);text-align:left;transition:.16s}
.title-card:active{transform:scale(.98)}
.title-card .i{font-size:18px}
.title-card b{display:block;font-size:12.5px;font-weight:800;margin-top:7px}
.title-card span{display:block;font-size:10.5px;color:var(--dim);margin-top:3px;line-height:1.4}
.title-card.on{border-color:rgba(255,206,92,.55);background:linear-gradient(150deg,rgba(255,206,92,.15),rgba(255,206,92,.03))}
.title-card .use{display:inline-block;margin-top:7px;font-size:10px;font-weight:800;color:var(--gold)}
.title-card.locked{opacity:.42}

.ach{display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:16px;background:var(--card2);border:1px solid var(--line);margin-bottom:8px}
.ach .i{width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:rgba(255,255,255,.06);filter:grayscale(1);opacity:.45}
.ach.on .i{filter:none;opacity:1;background:linear-gradient(140deg,rgba(255,206,92,.22),rgba(255,206,92,.06));border:1px solid rgba(255,206,92,.3)}
.ach .b b{display:block;font-size:13px;font-weight:800}
.ach .b span{display:block;font-size:11px;color:var(--dim);margin-top:2px;line-height:1.4}
.ach .ck{margin-left:auto;font-size:12px;color:var(--ok);font-weight:800}

.stat-line{margin-bottom:13px}
.stat-line .r{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:6px}
.stat-line .r span{color:var(--dim)}
.stat-line .track{height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.stat-line .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),#ff9d5c);transition:width .6s}
.stat-line.k .fill{background:linear-gradient(90deg,#ff8f8f,#ff5f7a)}
.stat-line.w .fill{background:linear-gradient(90deg,#6fd1ff,#3d8bff)}
.stat-line.g .fill{background:linear-gradient(90deg,#c9a6ff,#8b5cff)}
.stat-cards{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:20px}
.stat-cards .sc{padding:13px;border-radius:16px;background:var(--card2);border:1px solid var(--line)}
.stat-cards .sc b{display:block;font-size:19px;font-weight:800}
.stat-cards .sc span{display:block;font-size:10.5px;color:var(--dim);margin-top:3px;font-weight:600}

.chap-row{display:flex;align-items:center;gap:10px;padding:12px 13px;border-radius:15px;background:var(--card2);
  border:1px solid var(--line);margin-bottom:7px;text-align:left;width:100%}
.chap-row .em{font-size:17px;width:22px;text-align:center;flex:0 0 22px;opacity:.85}
.chap-row .n{flex:1;min-width:0;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chap-row .n small{display:block;font-size:10px;color:var(--dim2);font-weight:700;margin-top:2px}
.chap-row .st{font-size:10.5px;font-weight:800;color:var(--dim2);flex:0 0 auto}
.chap-row.done{border-color:rgba(63,224,162,.26)}
.chap-row.done .st{color:var(--gold)}

/* ---------- settings ---------- */
.set-row{display:flex;align-items:center;gap:12px;padding:15px 4px;border-bottom:1px solid rgba(255,255,255,.07)}
.set-row .t{flex:1}
.set-row .t b{display:block;font-size:14px;font-weight:700}
.set-row .t span{display:block;font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.4}
.sw{width:48px;height:28px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;transition:.2s;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:linear-gradient(120deg,#ffd979,#ffab4d)}
.sw.on::after{left:23px}
.danger{width:100%;margin-top:20px;min-height:48px;border-radius:15px;font-size:13px;font-weight:800;color:#ff9aa8;
  background:rgba(255,107,129,.09);border:1px solid rgba(255,107,129,.3)}
.about{margin-top:22px;padding:15px;border-radius:17px;background:var(--card2);border:1px solid var(--line);font-size:11.5px;color:var(--dim);line-height:1.75}
.about b{color:#cdd5ee}

/* ---------- tabbar ---------- */
.tabbar{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:30;
  width:100%;max-width:480px;display:flex;gap:4px;
  padding:6px 14px calc(6px + env(safe-area-inset-bottom));
  background:rgba(9,11,22,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid rgba(255,255,255,.08);
}
.tabbar.hide{display:none}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;border-radius:13px;
  color:var(--dim2);font-size:10px;font-weight:700;transition:.16s}
.tab .ti{font-size:16px;line-height:1;filter:grayscale(.65);opacity:.75}
.tab.on{color:var(--gold);background:rgba(255,206,92,.07)}
.tab.on .ti{filter:none;opacity:1}

/* ---------- toast / modal ---------- */
.toast{
  position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-150%);z-index:90;
  max-width:420px;width:calc(100% - 36px);
  display:flex;align-items:center;gap:10px;padding:11px 15px;border-radius:16px;
  background:linear-gradient(120deg,#2a2410,#1a1a2b);border:1px solid rgba(255,206,92,.4);
  box-shadow:0 16px 40px -14px rgba(0,0,0,.9);transition:transform .4s cubic-bezier(.2,.9,.25,1);
  font-size:12px;font-weight:700;
}
.toast.show{transform:translate(-50%,0)}
.toast .ti{font-size:17px}
.toast b{display:block;font-size:12px;color:var(--gold)}
.toast span{display:block;font-size:10.5px;color:var(--dim);margin-top:1px;font-weight:600}

.modal-bg{position:fixed;inset:0;background:rgba(4,5,10,.72);backdrop-filter:blur(4px);z-index:80;
  display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-bg.show{opacity:1;pointer-events:auto}
.modal{width:100%;max-width:330px;border-radius:22px;padding:21px 19px;background:linear-gradient(160deg,#1b2038,#121526);
  border:1px solid var(--line2);box-shadow:0 30px 80px -20px #000;transform:scale(.94);transition:transform .22s}
.modal-bg.show .modal{transform:none}
.modal h3{font-size:16.5px;font-weight:800;margin-bottom:8px;letter-spacing:-.02em}
.modal p{font-size:12.5px;color:var(--dim);line-height:1.6;margin-bottom:17px}
.modal .row{display:flex;gap:8px}
.modal .row button{flex:1;min-height:44px;border-radius:13px;font-size:13.5px;font-weight:800}
.modal .row .cancel{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--dim)}
.modal .row .ok{background:linear-gradient(120deg,#ffd979,#ffab4d);color:#241a05}
.modal .row .ok.red{background:linear-gradient(120deg,#ff8a9b,#ff5f7a);color:#2b0510}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:65;overflow:hidden}
.confetti i{position:absolute;width:8px;height:8px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(105vh) rotate(680deg);opacity:.2}}

.hidden{display:none !important}
@media (max-height:680px){
  .hero-title{font-size:24px}
  .card h2{font-size:20px}
  .card .body{font-size:14.5px;line-height:1.72}
  .q-text{font-size:19px}
  .ox{height:112px;font-size:46px}
  .res-score{font-size:50px}
  .clear-badge{width:82px;height:82px}
}
</style>
</head>
<body>
<div id="app">
  <section id="screen-home" class="screen active">
    <header class="hero">
      <div class="hero-bar">
        <div class="logo"><span class="dot">📖</span><span>역사 한 입</span></div>
        <button id="btn-sound-home" class="icon-btn" aria-label="소리 켜기/끄기">🔊</button>
      </div>
      <p class="hello" id="hello">정우 님, 오늘은 어떤 시대로 가 볼까요?</p>
      <h1 class="hero-title">이야기로 배우고<br><em>선택</em>으로 기억하는 역사</h1>
      <div class="badges" id="badges"></div>
    </header>
    <div id="home-body"></div>
  </section>

  <section id="screen-story" class="screen">
    <div class="story-head">
      <button class="icon-btn" id="btn-story-back" aria-label="나가기">✕</button>
      <div class="story-mid"><b id="story-chapter">챕터</b><span id="story-role">당신의 이야기</span></div>
      <div class="story-count" id="story-count">1 / 4</div>
    </div>
    <div class="bars" id="story-bars"></div>
    <div class="stage" id="story-stage"></div>
    <div class="story-foot">
      <button class="btn-ghost" id="btn-story-prev">이전</button>
      <button class="btn-primary" id="btn-story-next">다음 장면 <span>→</span></button>
    </div>
  </section>

  <section id="screen-quiz" class="screen">
    <div class="quiz-head">
      <button class="icon-btn" id="btn-quit" aria-label="그만두기">✕</button>
      <div class="progress-track"><div class="progress-fill" id="q-progress"></div></div>
      <div class="hud-score" id="q-score">0</div>
    </div>
    <div class="quiz-sub">
      <div class="chip" id="q-chip">한국사</div>
      <div class="hearts" id="q-hearts"></div>
      <div class="combo-badge" id="q-combo">🔥 0</div>
    </div>
    <div class="timer-track" id="timer-track"><div class="timer-fill" id="timer-fill"></div></div>
    <div class="q-wrap" id="q-wrap">
      <div class="q-index" id="q-index">질문 1 / 4</div>
      <h2 class="q-text" id="q-text"></h2>
      <div id="q-choices" class="choices"></div>
    </div>
  </section>

  <section id="screen-result" class="screen"><div id="result-body"></div></section>

  <section id="screen-collection" class="screen">
    <div class="page-head">
      <h1>도감</h1>
      <p>내가 지나온 이야기와 틀린 문제, 칭호를 모아 봤어요.</p>
    </div>
    <div class="seg" id="seg">
      <button data-seg="wrong" class="on">오답</button>
      <button data-seg="chapters">챕터</button>
      <button data-seg="titles">칭호</button>
      <button data-seg="stats">기록</button>
    </div>
    <div id="collection-body"></div>
  </section>

  }else{
    /* 이전 버전 기록에서 설정과 연속 출석만 이어받는다 */
    try{
      const old=JSON.parse(localStorage.getItem(OLDKEY)||'null');
      if(old && typeof old==='object'){
        if(typeof old.sound==='boolean') d.sound=old.sound;
        if(typeof old.vibrate==='boolean') d.vibrate=old.vibrate;
        if(old.streak && typeof old.streak==='object'){
          d.streak.count=old.streak.count||0;
          d.streak.best=old.streak.best||0;
          d.streak.last=old.streak.last||null;
        }
        if(old.title) d.title=old.title;
      }
    }catch(e){}
  }
  ['korean','world','general'].forEach(function(k){
    if(!d.catStats[k]) d.catStats[k]={a:0,c:0};
  });
  if(!d.best) d.best={daily:0,survival:0,review:0};
  if(!d.chapters) d.chapters={};
  if(!d.aces) d.aces={};
  return d;
}

/* ---------- sound ---------- */
let AC=null;
function ac(){
  if(AC) return AC;
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx) return null;
    AC=new Ctx();
  }catch(e){ AC=null; }
  return AC;
}
function tone(freq,delay,dur,type,vol){
  const c=ac(); if(!c) return;
  try{
    if(c.state==='suspended') c.resume();
    const t=c.currentTime+delay;
    const o=c.createOscillator();
    const g=c.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.06,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
function sfx(kind){
  if(!DATA.sound) return;
  if(kind==='ok'){ tone(680,0,.10,'sine',.055); tone(1020,.075,.16,'sine',.05); }
  else if(kind==='no'){ tone(220,0,.14,'triangle',.06); tone(160,.11,.20,'triangle',.055); }
  else if(kind==='combo'){ tone(880,0,.08,'sine',.045); tone(1180,.07,.09,'sine',.04); tone(1480,.14,.12,'sine',.035); }
  else if(kind==='end'){ tone(523,0,.12,'sine',.05); tone(659,.11,.12,'sine',.05); tone(784,.22,.22,'sine',.055); }
  else if(kind==='tap'){ tone(560,0,.035,'sine',.02); }
  else if(kind==='page'){ tone(420,0,.05,'sine',.025); tone(560,.04,.07,'sine',.02); }
  else if(kind==='badge'){ tone(1046,0,.09,'sine',.04); tone(1318,.09,.14,'sine',.04); }
}
function buzz(ms){
  if(!DATA.vibrate) return;
  try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){}
}

function startChapterQuiz(chId){
  const c=CH[chId]; if(!c) return;
  LAST={ mode:'chapter', chId:chId };
  LAST_CH=chId;
  G={
    mode:'chapter', chId:chId, queue:c.quiz.slice(), idx:0,
    score:0, combo:0, maxCombo:0, hearts:3,
    answered:0, correct:0, locked:false, roundWrong:[],
    limit:0, tEnd:0, raf:0, completed:false, reviewFixed:0
  };
  hideSheet();
  showScreen('quiz');
  renderQuestion();
}

function buildRound(mode){
  if(mode==='daily'){
    const rng=seeded(hashStr('hb-daily-'+todayKey()));
    return shuffle(ALLQ,rng).slice(0,5);
  }
  if(mode==='review'){
    const ids=Object.keys(DATA.wrong).sort(function(a,b){ return (DATA.wrong[b].at||0)-(DATA.wrong[a].at||0); }).slice(0,10);
    return shuffle(ids.map(function(id){ return QIDX[id]?QIDX[id].q:null; }).filter(Boolean));
  }
  return shuffle(ALLQ);
}

function start(mode){
  const qs=buildRound(mode);
  if(!qs.length){
    showToast('📝','복습할 문제가 없어요','먼저 챕터를 읽고 퀴즈를 풀어 보세요.');
    return;
  }
  LAST={ mode:mode, chId:null };
  G={
    mode:mode, chId:null, queue:qs, idx:0,
    score:0, combo:0, maxCombo:0, hearts:3,
    answered:0, correct:0, locked:false, roundWrong:[],
    limit:(mode==='survival'?15:0), tEnd:0, raf:0, completed:false, reviewFixed:0
  };
  hideSheet();
  showScreen('quiz');
  renderQuestion();
}

function modeName(g){
  if(g.mode==='chapter') return 'CH '+CH[g.chId].no+' · '+CH[g.chId].title;
  if(g.mode==='daily') return '오늘의 복습';
  if(g.mode==='survival') return '서바이벌';
  return '오답 복습';
}

function renderQuestion(){
  const q=G.queue[G.idx];
  const surv=G.mode==='survival';
  const qch=CH[q.chId]||CH.k1;

  let idxHtml='';
  if(G.mode==='chapter'){
    if(q.label) idxHtml+='<span class="lb">'+esc(q.label)+'</span>';
    idxHtml+='<span>질문 '+(G.idx+1)+' / '+G.queue.length+'</span>';
  }else{
    idxHtml='<span>'+(surv?'생존 ':'Q ')+(G.idx+1)+(surv?'':' / '+G.queue.length)+'</span>';
  }
  $('q-index').innerHTML=idxHtml;

  $('q-score').textContent=G.score;
  $('q-text').textContent=q.q;

  const chip=$('q-chip');
  if(G.mode==='chapter'){
    chip.className='chip '+CATS[qch.cat].cls;
    chip.textContent='CH '+qch.no+' · '+qch.era;
  }else if(G.mode==='daily'){
    chip.className='chip'; chip.textContent='오늘의 복습';
  }else if(G.mode==='survival'){
    chip.className='chip'; chip.textContent='서바이벌';
  }else{
    chip.className='chip '+CATS[qch.cat].cls; chip.textContent='오답 복습';
  }

  const hearts=$('q-hearts');
  if(surv){
    hearts.classList.remove('hidden');
    hearts.innerHTML=heartsHTML();
  }else{
    hearts.classList.add('hidden');
    hearts.innerHTML='';
  }

  const cb=$('q-combo');
  cb.classList.toggle('on',G.combo>=2);
  cb.innerHTML='🔥 '+G.combo;

  const pf=$('q-progress');
  if(surv){
    pf.style.background='linear-gradient(90deg,#3fe0a2,#8ef0c0)';
    pf.style.width='100%';
  }else{
    pf.style.background='';
    pf.style.width=Math.round(G.idx/G.queue.length*100)+'%';
  }

  const box=$('q-choices');
  if(q.type==='ox'){
    box.className='ox-grid';
    box.innerHTML=[0,1].map(function(i){
      return '<button class="ox" data-v="'+q.choices[i]+'" data-i="'+i+'">'+q.choices[i]+
        '<small>'+(i===0?'맞아요':'아니에요')+'</small></button>';
    }).join('');
  }else{
    box.className='choices';
    box.innerHTML=q.choices.map(function(c,i){
      return '<button class="choice" data-i="'+i+'"><span class="key">'+NUM[i]+'</span><span>'+esc(c)+'</span></button>';
    }).join('');
  }

  G.locked=false;
  scrollTop();
  if(surv) startTimer(); else stopTimer();
}

function heartsHTML(){
  let s='';
  for(let i=0;i<3;i++){
    s+='<span class="'+(i<G.hearts?'':'off')+'">'+(i<G.hearts?'❤':'♡')+'</span>';
  }
  return s;
}
function updateHearts(){
  if(!G) return;
  if(G.mode==='survival') $('q-hearts').innerHTML=heartsHTML();
}

function startTimer(){
  stopTimer();
  G.limit=15;
  G.tEnd=performance.now()+G.limit*1000;
  $('timer-track').classList.add('on');
  tickTimer();
}
function stopTimer(){
  if(G && G.raf){ cancelAnimationFrame(G.raf); G.raf=0; }
  const t=$('timer-track'); if(t) t.classList.remove('on');
}
function tickTimer(){
  if(!G||G.locked) return;
  const left=Math.max(0,G.tEnd-performance.now());
  const f=left/(G.limit*1000);
  const tf=$('timer-fill');
  if(tf){
    tf.style.width=(f*100)+'%';
    tf.className='timer-fill'+(f<=0.25?' danger':(f<=0.5?' warn':''));
  }
  if(left<=0){ answer(-1); return; }
  G.raf=requestAnimationFrame(tickTimer);
}

function answer(pick){
  if(!G||G.locked) return;
  G.locked=true;
  if(G.raf){ cancelAnimationFrame(G.raf); G.raf=0; }
  const tt=$('timer-track'); if(tt) tt.classList.remove('on');

  const q=G.queue[G.idx];
  const surv=G.mode==='survival';
  const timedOut=(pick===-1);
  const ok=!timedOut&&pick===q.answer;

  G.answered++;
  let gain=0;
  if(ok){
    G.correct++;
    G.combo++;
    if(G.combo>G.maxCombo) G.maxCombo=G.combo;
    const bonus=Math.min(G.combo-1,5)*20;
    let speed=0;
    if(surv){
      const left=Math.max(0,G.tEnd-performance.now());
      speed=Math.round(left/(G.limit*1000)*50);
    }
    gain=100+bonus+speed;
    G.score+=gain;
  }else{
    G.combo=0;
    if(surv) G.hearts--;
  }

  const btns=Array.prototype.slice.call(document.querySelectorAll('#q-choices button'));
  btns.forEach(function(b,i){
    b.disabled=true;
    if(i===q.answer) b.classList.add('correct');
    else if(i===pick) b.classList.add('wrong');
    else b.classList.add('dim');
  });

  const d=DATA;
  d.total.answered++;
  if(ok) d.total.correct++;
  const cs=d.catStats[q.chId?CH[q.chId].cat:'korean'];
  if(cs){ cs.a++; if(ok) cs.c++; }
  d.seen[q.id]=true;
  if(G.maxCombo>d.maxCombo) d.maxCombo=G.maxCombo;
  if(ok){
    if(d.wrong[q.id]) delete d.wrong[q.id];
    if(G.mode==='review'){ d.reviewCorrect++; G.reviewFixed++; }
  }else{
    const prev=d.wrong[q.id];
    d.wrong[q.id]={ n:(prev?prev.n:0)+1, pick:pick, at:Date.now() };
    G.roundWrong.push(q.id);
  }
  save();

  $('q-score').textContent=G.score;
  updateHearts();
  const cb=$('q-combo');
  cb.classList.toggle('on',G.combo>=2);
  cb.innerHTML='🔥 '+G.combo;
  if(ok){
    if(G.combo>=2){
      cb.classList.remove('pop'); void cb.offsetWidth; cb.classList.add('pop');
    }
    floatScore('+'+gain+(G.combo>=3?'  🔥'+G.combo:''));
    sfx(G.combo>=5?'combo':'ok');
    buzz(14);
  }else{
    sfx('no');
    buzz(timedOut?40:30);
  }

  checkAch(true);
  showFeedback(q,pick,ok,timedOut,gain);
}

function floatScore(txt){
  const el=document.createElement('div');
  el.className='float-score';
  el.textContent=txt;
  const app=$('app');
  app.appendChild(el);
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },1000);
}

function choiceText(q,i){
  if(i===null||i===undefined||i<0) return '';
  return q.type==='ox' ? q.choices[i] : (NUM[i]+' '+q.choices[i]);
}

function showFeedback(q,pick,ok,timedOut,gain){
  const g=G;
  const chMode=g.mode==='chapter';
  const surv=g.mode==='survival';
  const last=g.idx>=g.queue.length-1;
  const dead=surv&&g.hearts<=0;
  let nextLabel;
  if(chMode) nextLabel=(g.idx>=g.queue.length-1)?'챕터 결과 보기':'다음 선택';
  else if(dead) nextLabel='결과 보기';
  else nextLabel=(last?'결과 보기':'다음 문제');

  let head,answerLine;
  if(ok){
    const sub=chMode ? (g.combo>=3?g.combo+'연속 · 역사와 같은 선택':'역사의 선택과 같습니다')
      : (g.combo>=3?g.combo+'연속 · 콤보 보너스':'좋아요, 감이 오는데요');
    head='<div class="res-ico ok">✓</div><div class="tt">정답입니다<small>'+sub+'</small></div>'+
      '<div class="pts">+'+gain+'</div>';
    answerLine='';
  }else{
    const sub=chMode ? '역사는 다른 쪽을 골랐습니다'
      : (surv&&g.hearts>0?'하트가 하나 줄었어요':'정답을 확인해 보세요');
    head='<div class="res-ico no">✕</div><div class="tt">'+(timedOut?'시간 초과!':'다른 길을 골랐습니다')+
      '<small>'+sub+'</small></div><div class="pts">+0</div>';
    answerLine='<div class="ex-answer">'+(chMode?'역사의 선택':'정답')+' <b>'+esc(choiceText(q,q.answer))+'</b>'+
      (!timedOut&&pick>=0?' · 내 선택 <s>'+esc(choiceText(q,pick))+'</s>':'')+'</div>';
  }

  $('sheet-body').innerHTML=
    '<div class="sheet-head">'+head+'</div>'+
    '<div class="sheet-body">'+
      answerLine+
      '<span class="ex-label">'+(chMode?'역사의 대답':'한 입 해설')+'</span>'+
      '<div class="ex-text">'+esc(q.ex)+'</div>'+
    '</div>'+
    '<button class="btn-next" data-act="next">'+nextLabel+'</button>';

  $('sheet').classList.add('show');
}

function hideSheet(){ $('sheet').classList.remove('show'); }

function nextQuestion(){
  if(!G||!G.locked) return;
  hideSheet();
  const surv=G.mode==='survival';
  const last=G.idx>=G.queue.length-1;

  if(surv){
    if(G.hearts<=0){ finish(true); return; }
    if(last){ G.queue=G.queue.concat(shuffle(ALLQ)); }
    G.idx++;
    renderQuestion();
    return;
  }
  if(last){ finish(true); return; }
  G.idx++;
  renderQuestion();
}

/* ---------- finish ---------- */
function touchStreak(){
  const d=DATA, t=todayKey();
  if(d.streak.last!==t){
    d.streak.count=(d.streak.last===yesterdayKey())?(d.streak.count||0)+1:1;
    d.streak.last=t;
    if(d.streak.count>d.streak.best) d.streak.best=d.streak.count;
  }
}

function finish(completed){
  if(!G) return;
  stopTimer();
  hideSheet();
  const g=G, d=DATA;
  g.completed=!!completed;
  if(g.answered>0){ d.rounds++; touchStreak(); }

  if(g.mode==='chapter') applyChapter();
  else applyRound();
  save();

  g.newAch=checkAch(false);
  if(g.mode==='chapter') renderChapterResult();
  else renderRoundResult();
  showScreen('result');

  const cleared=(g.mode==='chapter'&&g.cleared);
  if(cleared||g.isRecord) confetti();
  sfx(g.completed?'end':'tap');

  if(g.newAch.length){
    g.newAch.forEach(function(a,k){
      setTimeout(function(){ showToast(a.icon,a.name+' 달성!',a.desc); }, 600+k*1400);
    });
  }
}

function applyChapter(){
  const g=G, c=CH[g.chId];
  const rec=chapterRec(c.id);
  const n=c.quiz.length;
  rec.plays=(rec.plays||0)+1;
  const correct=g.correct;
  let stars=0;
  if(correct>=n) stars=3; else if(correct>=n-1) stars=2; else if(correct>=n-2) stars=1;
  g.stars=stars;
  g.cleared=!!(g.completed && g.answered===n);
  g.prevBest=rec.best||0;
  if(g.cleared){
    rec.cleared=true;
    if(stars>rec.stars) rec.stars=stars;
    if(g.score>rec.best){ rec.best=g.score; }
    if(correct===n) DATA.aces[c.id]=1;
    rec.read=c.cards.length;
    g.isRecord=(g.prevBest>0 && g.score>g.prevBest);
  }else if(g.answered>0){
    if(g.score>rec.best) rec.best=g.score;
    g.isRecord=false;
  }
}

function applyRound(){
  const g=G, d=DATA;
  const key=(g.mode==='daily'?'daily':(g.mode==='survival'?'survival':'review'));
  const prevBest=d.best[key]||0;
  g.isRecord=(g.answered>0 && g.score>prevBest);
  g.prevBest=prevBest;
  if(g.score>prevBest) d.best[key]=g.score;
  if(g.mode==='survival' && g.answered>d.survBest) d.survBest=g.answered;
  if(g.mode==='daily' && g.answered>=g.queue.length){
    d.dailyDate=todayKey();
    if(g.score>(d.dailyScore||0)) d.dailyScore=g.score;
  }
}

function confetti(){
  const box=$('confetti');
  const colors=['#ffce5c','#ff9d5c','#5cc8ff','#b78dff','#3fe0a2','#ff6b81'];
  let html='';
  for(let i=0;i<44;i++){
    const left=Math.random()*100;
    const delay=Math.random()*0.5;
    const dur=1.6+Math.random()*1.4;
    const size=5+Math.random()*7;
    const col=colors[Math.floor(Math.random()*colors.length)];
    html+='<i style="left:'+left+'%;top:0;width:'+size+'px;height:'+(size*0.6)+'px;background:'+col+
      ';animation-delay:'+delay+'s;animation-duration:'+dur+'s;transform:rotate('+Math.round(Math.random()*180)+'deg)"></i>';
  }
  box.innerHTML=html;
  setTimeout(function(){ box.innerHTML=''; },3400);
}

function renderChapterResult(){
  const g=G, c=CH[g.chId];
  const answered=g.answered, correct=g.correct;
  const cleared=!!g.cleared;
  const nextId=nextChapterId(c.id);
  const newAch=g.newAch||[];
  const unlockHtml=newAch.length?
    '<div class="unlocked"><div class="h">NEW 칭호 · 업적</div>'+
    newAch.map(function(a){
      return '<div class="a"><span>'+a.icon+'</span><span>'+esc(a.name)+(a.title?' <span style="color:var(--dim);font-weight:600">· '+esc(a.title)+'</span>':'')+'</span></div>';
    }).join('')+'</div>':'';

  $('result-body').innerHTML=
    '<div class="clear-wrap">'+
      '<div class="clear-kicker">'+(cleared?'CHAPTER CLEAR':'STORY PAUSED')+'</div>'+
      (cleared
        ? '<div class="clear-badge"><span><span class="em">'+c.emoji+'</span>클리어</span></div>'
        : '<div class="clear-badge miss">중단</div>')+
      '<div class="stars-big">'+starBig(g.stars)+'</div>'+
      '<div class="clear-title">'+esc(c.title)+'</div>'+
      '<div class="clear-sub">'+esc(c.era)+' · '+correct+'/'+answered+' 정답 · '+g.score+'점</div>'+
      (g.isRecord?'<div class="record">🏅 최고 점수 갱신</div>':'')+
      (cleared?'<div class="clear-learned"><b>이 챕터에서 얻은 것</b>'+esc(c.learned)+'</div>':'')+
      unlockHtml+
      '<div class="res-actions">'+
        '<button class="btn-primary" data-act="'+(cleared&&nextId?'next-chapter':'go-home')+'"'+
          (cleared&&nextId?' data-id="'+nextId+'"':'')+'>'+
          (cleared?(nextId?'다음 챕터 →':'홈으로'):'홈으로')+'</button>'+
        '<button class="btn-ghost" data-act="retry-chapter">다시 풀기</button>'+
      '</div>'+
      '<div class="res-note">'+esc(g.roundWrong.length?('틀린 선택 '+g.roundWrong.length+'개는 도감 > 오답에 담겼어요.'):'모든 선택이 역사와 같았습니다.')+'</div>'+
      '<div style="height:18px"></div>'+
    '</div>';
}

function starBig(n){
  n=Math.max(0,Math.min(3,n||0));
  let s='';
  for(let i=0;i<3;i++) s+= i<n?'<span>★</span>':'<span class="off">★</span>';
  return s;
}

function renderRoundResult(){
  const g=G;
  const surv=g.mode==='survival';
  const answered=g.answered, correct=g.correct;
  const acc=answered?Math.round(correct/answered*100):0;
  const title=!g.completed?'중단한 라운드':(surv?'서바이벌 종료':'라운드 완료');
  const sub=modeName(g)+' · '+answered+'문제';
  const newAch=g.newAch||[];
  const unlockHtml=newAch.length?
    '<div class="unlocked"><div class="h">NEW 칭호 · 업적</div>'+
    newAch.map(function(a){
      return '<div class="a"><span>'+a.icon+'</span><span>'+esc(a.name)+(a.title?' <span style="color:var(--dim);font-weight:600">· '+esc(a.title)+'</span>':'')+'</span></div>';
    }).join('')+'</div>':'';

  let note;
  if(!answered) note='다음엔 한 문제라도 골라 봐요.';
  else if(surv) note='최고 '+DATA.survBest+'문제 생존 · 틀린 문제는 오답에 담겼어요.';
  else if(g.roundWrong.length) note='틀린 '+g.roundWrong.length+'문제는 도감 > 오답에 저장했어요.';
  else note='모두 맞혔어요. 다음엔 서바이벌에 도전해 볼까요?';

  $('result-body').innerHTML=
    '<div class="res-wrap">'+
      '<div class="res-kicker">'+esc(title).toUpperCase()+'</div>'+
      '<div class="res-score" id="res-score">0<small>점</small></div>'+
      '<div class="res-mode">'+esc(sub)+'</div>'+
      (g.isRecord?'<div class="record">🏅 '+(g.prevBest>0?'신기록! 이전 최고 '+g.prevBest+'점':'첫 기록 등록!')+'</div>':'')+
      '<div class="res-grid">'+
        '<div class="res-cell"><b class="'+(answered&&correct===answered?'ok':'')+'">'+correct+'/'+answered+'</b><span>정답</span></div>'+
        '<div class="res-cell"><b>'+acc+'%</b><span>정답률</span></div>'+
        '<div class="res-cell"><b>'+g.maxCombo+'</b><span>최고 콤보</span></div>'+
      '</div>'+
      unlockHtml+
      '<div class="res-note">'+esc(note)+'</div>'+
      '<div class="res-actions">'+
        '<button class="btn-primary" data-act="again">다시 도전</button>'+
        '<button class="btn-ghost" data-act="go-home">홈으로</button>'+
      '</div>'+
      '<div style="height:20px"></div>'+
    '</div>';

  const el=$('res-score');
  const target=g.score;
  const t0=performance.now();
  const dur=700;
  function step(t){
    const p=Math.min(1,(t-t0)/dur);
    const e=1-Math.pow(1-p,3);
    el.innerHTML=Math.round(target*e)+'<small>점</small>';
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  setTimeout(function(){ if(el) el.innerHTML=target+'<small>점</small>'; },dur+120);
}

function nextChapterId(id){
  const c=CH[id];
  const list=catChapters(c.cat);
  const i=list.map(function(x){ return x.id; }).indexOf(id);
  if(i>=0 && i<list.length-1) return list[i+1].id;
  const cats=Object.keys(CATS);
  const ci=cats.indexOf(c.cat);
  for(let k=1;k<=cats.length;k++){
    const nList=catChapters(cats[(ci+k)%cats.length]);
    if(nList.length) return nList[0].id;
  }
  return null;
}

/* ---------- collection ---------- */
function renderCollection(){
  Array.prototype.forEach.call(document.querySelectorAll('#seg button'),function(b){
    b.classList.toggle('on',b.dataset.seg===SEG);
  });
  if(SEG==='wrong') renderWrong();
  else if(SEG==='chapters') renderChapters();
  else if(SEG==='titles') renderTitles();
  else renderStats();
}

function wrongIds(){
  return Object.keys(DATA.wrong).sort(function(a,b){ return (DATA.wrong[b].at||0)-(DATA.wrong[a].at||0); });
}

      '<div class="ans">내 선택 <s>'+esc(myPick)+'</s> · 역사의 선택 <b>'+esc(choiceText(q,q.answer))+'</b></div>'+
      '<div class="ex">'+esc(q.ex)+'</div>'+
    '</div>';
  }).join('');

  $('collection-body').innerHTML=

    const list=catChapters(k);
    html+='<div class="section-label" style="margin-top:16px"><h2>'+c.icon+' '+c.name+'</h2>'+
      '<span class="hint">'+catCleared(k)+'/'+list.length+'</span></div>';
    list.forEach(function(ch){
      const r=DATA.chapters[ch.id]||{read:0,cleared:false,stars:0};
      html+='<button class="chap-row'+(r.cleared?' done':'')+'" data-act="chapter" data-id="'+ch.id+'">'+
        '<span class="em">'+ch.emoji+'</span>'+
        '<span class="n">'+esc(ch.title)+'<small>CH '+ch.no+' · '+esc(ch.era)+'</small></span>'+
        '<span class="st">'+(r.cleared?starText(r.stars):(r.read>0?Math.min(r.read,ch.cards.length)+'/'+ch.cards.length:'시작'))+'</span>'+
      '</button>';
    });
  });
  $('collection-body').innerHTML=html;
}

function renderTitles(){
  const owned=ACHS.filter(function(a){ return a.title && DATA.ach[a.id]; });
  let html='';
  if(!owned.length){
    html+='<div class="empty" style="padding:24px 16px 28px"><span class="i">🎖️</span><b>아직 칭호가 없어요</b>'+
      '<span>챕터를 하나만 클리어해도 첫 칭호를 받아요.</span></div>';
  }else{
    html+='<div class="title-grid" style="margin-bottom:18px">'+owned.map(function(a){
      const on=DATA.title===a.title;
      return '<button class="title-card'+(on?' on':'')+'" data-act="equip" data-title="'+esc(a.title)+'">'+
        '<span class="i">'+a.icon+'</span><b>'+esc(a.title)+'</b><span>'+esc(a.desc)+'</span>'+
        '<span class="use">'+(on?'✔ 사용 중':'눌러서 착용')+'</span></button>';
    }).join('')+'</div>';
  }
  html+='<div class="section-label" style="margin:4px 2px 11px"><h2>업적 '+Object.keys(DATA.ach).length+' / '+ACHS.length+'</h2></div>';
  html+=ACHS.map(function(a){
    const got=!!DATA.ach[a.id];
    return '<div class="ach '+(got?'on':'locked')+'">'+
      '<span class="i">'+(got?a.icon:'🔒')+'</span>'+
      '<span class="b"><b>'+esc(a.name)+'</b><span>'+esc(a.desc)+'</span></span>'+
      (got?'<span class="ck">✓</span>':'')+
    '</div>';
  }).join('');
  $('collection-body').innerHTML=html;
}

function renderStats(){
  const d=DATA;
  const acc=d.total.answered?Math.round(d.total.correct/d.total.answered*100):0;
  let bars='';
  Object.keys(CATS).forEach(function(k){
    const st=d.catStats[k];
    const r=st.a?Math.round(st.c/st.a*100):0;
    const total=catChapters(k).length;
    bars+='<div class="stat-line '+CATS[k].cls+'">'+
      '<div class="r"><span>'+CATS[k].icon+' '+CATS[k].name+'</span><b>'+catCleared(k)+'/'+total+' 챕터 · '+r+'%</b></div>'+
      '<div class="track"><div class="fill" style="width:'+Math.round(catCleared(k)/total*100)+'%"></div></div></div>';
  });

  $('collection-body').innerHTML=
    '<div class="stat-cards" style="margin-top:16px">'+
      '<div class="sc"><b>'+d.total.answered+'</b><span>누적 푼 문제</span></div>'+
      '<div class="sc"><b>'+acc+'%</b><span>누적 정답률</span></div>'+
      '<div class="sc"><b>'+d.maxCombo+'</b><span>최고 콤보</span></div>'+
      '<div class="sc"><b>'+(d.streak.best||0)+'일</b><span>최장 연속</span></div>'+
    '</div>'+
    '<div class="section-label" style="margin-top:0"><h2>카테고리 진행</h2></div>'+
    bars+
    '<div class="section-label"><h2>최고 점수</h2></div>'+
    '<div class="stat-cards">'+
      '<div class="sc"><b>'+d.best.daily+'</b><span>오늘의 복습</span></div>'+
      '<div class="sc"><b>'+d.best.survival+'</b><span>서바이벌</span></div>'+
      '<div class="sc"><b>'+d.best.review+'</b><span>오답 복습</span></div>'+
      '<div class="sc"><b>'+(d.survBest||0)+'</b><span>서바이벌 최고 생존</span></div>'+
    '</div>'+
    '<div class="section-label"><h2>탐구 기록</h2></div>'+
    '<div class="stat-cards">'+
      '<div class="sc"><b>'+clearedCount()+'</b><span>클리어한 챕터</span></div>'+
      '<div class="sc"><b>'+Object.keys(d.aces).length+'</b><span>만점 챕터</span></div>'+
      '<div class="sc"><b>'+d.rounds+'</b><span>완료한 라운드</span></div>'+
      '<div class="sc"><b>'+Object.keys(d.wrong).length+'</b><span>남은 오답</span></div>'+
    '</div>'+
    '<div style="height:10px"></div>';
}

/* ---------- settings ---------- */
function renderSettings(){
  const s=DATA.sound, v=DATA.vibrate;
  $('settings-body').innerHTML=
    '<div class="set-row"><div class="t"><b>효과음</b><span>정답·오답·장면 넘김 소리를 켜고 꺼요</span></div>'+
      '<button class="sw '+(s?'on':'')+'" data-act="toggle-sound" aria-label="효과음"></button></div>'+
    '<div class="set-row"><div class="t"><b>진동</b><span>답을 고를 때 짧게 진동해요 (안드로이드)</span></div>'+
      '<button class="sw '+(v?'on':'')+'" data-act="toggle-vibrate" aria-label="진동"></button></div>'+
    '<div class="set-row"><div class="t"><b>이야기 구성</b><span>총 '+CHAPTERS.length+'챕터 · 한국사 '+catChapters('korean').length+
      ' · 세계사 '+catChapters('world').length+' · 교양 '+catChapters('general').length+' · 문제 '+ALLQ.length+'개</span></div></div>'+
    '<div class="set-row"><div class="t"><b>저장 방식</b><span>기록은 이 브라우저에만 저장돼요 (localStorage)</span></div></div>'+
    '<button class="danger" data-act="reset">모든 기록 지우기</button>'+
    '<div class="about"><b>역사 한 입</b> · 한 시대의 주인공이 되어 장면을 읽고, 선택으로 퀴즈를 푸는 이야기 게임.<br>'+
      '정답은 “그때 실제로 일어난 일”이에요. 틀려도 괜찮아요. 역사가 무엇을 골랐는지 알면 그것이 공부니까요.<br><br>'+
      '정우 님을 위해 만든 개인용 게임이에요. 🍽️</div>'+
    '<div style="height:16px"></div>';
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  const m=e.target.closest('[data-m]');
  if(m){
    $('modal-bg').classList.remove('show');
    const r=modalResolve; modalResolve=null;
    if(r) r(m.dataset.m==='1');
    return;
  }

  const tab=e.target.closest('[data-tab]');
  if(tab){
    sfx('tap');
    if(tab.dataset.tab==='home'){ renderHome(); showScreen('home'); }
    else if(tab.dataset.tab==='collection'){ renderCollection(); showScreen('collection'); }
    else { renderSettings(); showScreen('settings'); }
    return;
  }

  const el=e.target.closest('[data-act]');
  if(!el) return;
  const act=el.dataset.act;

  if(act==='home-cat'){
    sfx('tap');
    DATA.homeCat=el.dataset.cat; save(); renderHome();
  }
  else if(act==='chapter'){
    sfx('tap');
    openChapter(el.dataset.id);
  }
  else if(act==='story-pick'){
    storyPick(Number(el.dataset.i));
  }
  else if(act==='start'){
    sfx('tap');
    start(el.dataset.mode);
  }
  else if(act==='next'){ nextQuestion(); }
  else if(act==='again'){
    if(LAST.mode==='chapter' && LAST.chId) startChapterQuiz(LAST.chId);
    else start(LAST.mode);
  }
  else if(act==='retry-chapter'){
    const id=LAST.chId||LAST_CH;
    if(id) startChapterQuiz(id); else exitStory();
  }
  else if(act==='next-chapter'){
    const id=el.dataset.id;
    if(id){ openChapter(id); }
    else { renderHome(); showScreen('home'); }
  }
  else if(act==='go-home'){ G=null; ST=null; renderHome(); showScreen('home'); }
  else if(act==='toggle-sound'){
    DATA.sound=!DATA.sound; save(); renderSettings();
    if(DATA.sound) sfx('tap');
  }
  else if(act==='toggle-vibrate'){
    DATA.vibrate=!DATA.vibrate; save(); renderSettings(); buzz(20);
  }
  else if(act==='reset'){
    confirmModal({
      title:'모든 기록을 지울까요?',
      desc:'최고 점수, 클리어한 챕터, 오답, 칭호가 모두 사라져요. 되돌릴 수 없습니다.',
      ok:'지우기', cancel:'취소', danger:true
    }, function(yes){
      if(!yes) return;
      DATA=JSON.parse(JSON.stringify(DEFAULT));
      save();
      G=null; ST=null;
      renderHome(); renderSettings(); showScreen('settings');
      showToast('🗑️','기록을 지웠어요','처음부터 다시 시작해요.');
    });
  }
  else if(act==='equip'){
    DATA.title=el.dataset.title; save();
    renderTitles();
    showToast('🎖️','칭호를 착용했어요',DATA.title);
  }
});

$('q-choices').addEventListener('click',function(e){
  const b=e.target.closest('button'); if(!b) return;
  answer(Number(b.dataset.i));
});

$('seg').addEventListener('click',function(e){
  const b=e.target.closest('[data-seg]'); if(!b) return;
  SEG=b.dataset.seg;
  sfx('tap');
  renderCollection();
});

$('btn-quit').addEventListener('click',function(){
  if(!G) return;
  confirmModal({
    title:(G.mode==='chapter'?'이야기를 나갈까요?':'그만둘까요?'),
    desc:(G.mode==='chapter'?'지금까지 고른 문제로 결과를 볼 수 있어요. 틀린 선택은 오답에 남습니다.':'지금까지 푼 문제의 점수로 라운드가 끝나요. 오답은 노트에 남습니다.'),
    ok:'나가기', cancel:'계속하기'
  }, function(yes){ if(yes) finish(false); });
});

$('btn-story-back').addEventListener('click',function(){
  sfx('tap');
  exitStory();
});
$('btn-story-next').addEventListener('click',function(){ storyNext(); });
$('btn-story-prev').addEventListener('click',function(){ storyPrev(); });

/* 스와이프로 장면 넘기기 */
(function(){
  const stage=$('story-stage');
  let sx=0, sy=0, moved=false;
  stage.addEventListener('touchstart',function(e){
    if(!e.touches||!e.touches[0]) return;
    sx=e.touches[0].clientX; sy=e.touches[0].clientY; moved=false;
  },{passive:true});
  stage.addEventListener('touchmove',function(e){
    if(!e.touches||!e.touches[0]) return;
    const dx=e.touches[0].clientX-sx, dy=e.touches[0].clientY-sy;
    if(Math.abs(dx)>18 && Math.abs(dx)>Math.abs(dy)) moved=true;
  },{passive:true});
  stage.addEventListener('touchend',function(e){
    if(!e.changedTouches||!e.changedTouches[0]) return;
    const dx=e.changedTouches[0].clientX-sx;
    if(Math.abs(dx)>56 && moved){ if(dx<0) storyNext(); else storyPrev(); }
  },{passive:true});
})();

$('btn-sound-home').addEventListener('click',function(){
  DATA.sound=!DATA.sound; save();
  this.textContent=DATA.sound?'🔊':'🔇';
  if(DATA.sound) sfx('tap');
  if(SCREEN==='settings') renderSettings();
});

document.addEventListener('keydown',function(e){
  if(SCREEN==='story'&&ST){
    if(e.key==='ArrowRight'||e.key==='Enter'){ e.preventDefault(); storyNext(); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); storyPrev(); }
    else if(e.key==='Escape'){ exitStory(); }
    return;
  }
  if(SCREEN!=='quiz'||!G) return;
  if(G.locked){
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); nextQuestion(); }
    return;
  }
  if(e.key==='Enter'){
    e.preventDefault();
    const n=document.querySelectorAll('#q-choices button').length;
    if(n===2) answer(0);
    return;
  }
  const n=Number(e.key);
  const total=document.querySelectorAll('#q-choices button').length;
  if(n>=1&&n<=total){ e.preventDefault(); answer(n-1); }
});

/* ---------- boot ---------- */
function boot(){
  const sb=$('btn-sound-home');
  if(sb) sb.textContent=DATA.sound?'🔊':'🔇';
  renderHome();
  renderSettings();
  showScreen('home');
}
document.addEventListener('DOMContentLoaded',boot);
if(document.readyState!=='loading') boot();

window.__HB={
  DATA:function(){ return DATA; },
  CHAPTERS:CHAPTERS, CH:CH, CATS:CATS, ALLQ:ALLQ,
  state:function(){ return {screen:SCREEN, G:G, ST:ST}; },
  openChapter:openChapter, startChapterQuiz:startChapterQuiz, start:start
};

})();


</script>
