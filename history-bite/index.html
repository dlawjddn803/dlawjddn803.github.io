function renderStory(){
  if(!ST) return;
  const c=CH[ST.ch];
  const n=c.scenes.length;
  const atCta=ST.step>=n;
  const s=atCta?null:c.scenes[ST.step];

  $('story-chapter').textContent='CH '+c.no+' · '+c.unit+' — '+c.title;
  $('story-role').textContent=atCta?'당신의 선택을 확인할 시간':c.role;
  $('story-count').textContent=atCta?'QUIZ':(ST.step+1)+' / '+n;

  let bars='';
  for(let i=0;i<n;i++){
    bars+='<div class="bar'+(i<ST.step?' on':(i===ST.step?' cur':''))+'"><i></i></div>';
  }
  $('story-bars').innerHTML=bars;

  const stage=$('story-stage');
  stage.innerHTML=atCta?ctaHTML(c):cardHTML(c,s,ST.step);
  stage.scrollTop=0;

  if(!atCta && s.choice && ST.picks[ST.step]!==undefined){
    paintPick(ST.picks[ST.step]);
  }

  $('btn-story-prev').disabled=(ST.step===0);
  const next=$('btn-story-next');
  if(atCta){
    next.innerHTML='방금 읽은 내용 퀴즈 풀기 <span>→</span>';
  }else if(ST.step===n-1){
    next.innerHTML='퀴즈 준비 <span>→</span>';
  }else{
    next.innerHTML='다음 장면 <span>→</span>';
  }
}

function storyNext(){
  if(!ST) return;
  const c=CH[ST.ch];
  if(ST.step < c.scenes.length){
    ST.step++; ST.dir=1;
    noteRead(c);
    sfx('page');
    renderStory();
  }else{
    startChapterQuiz(ST.ch);
  }
}
function storyPrev(){
  if(!ST) return;
  if(ST.step>0){ ST.step--; ST.dir=-1; sfx('page'); renderStory(); }
  else exitStory();
}
function exitStory(){
  ST=null;
  renderHome();
  showScreen('home');
  const hs=$('screen-home'); if(hs) hs.scrollTop=HOME_SCROLL;
}

function paintPick(i){
  if(!ST) return;
  const c=CH[ST.ch];
  const s=c.scenes[ST.step];
  if(!s || !s.choice) return;
  const ch=s.choice;
  const box=$('story-pick'); if(!box) return;
  const btns=box.querySelectorAll('button');
  Array.prototype.forEach.call(btns,function(b,k){
    b.classList.toggle('sel',k===i);
    if(k!==i) b.classList.add('dimmed');
  });
  const hi=(ch.actual==='b')?1:0;
  const mine=(i===0)?ch.a:ch.b;
  const hist=(hi===0)?ch.a:ch.b;
  let html='<div class="rev">';
  if(i===hi){
    html+='<b>당신의 선택이 역사가 되었습니다</b>';
    html+='<span class="mine">당신의 선택 · '+esc(mine)+'</span>';
    html+='<div>'+esc(ch.explain)+'</div>';
  }else{
    html+='<b>역사는 다른 길을 걸었습니다</b>';
    html+='<span class="mine">당신의 선택 · '+esc(mine)+'</span>';
    html+='<div>역사는 <b style="color:#ffe2a2">'+esc(hist)+'</b> 쪽을 택했습니다. '+esc(ch.explain)+'</div>';
  }
  html+='</div>';
  const rev=$('story-rev');
  if(rev) rev.innerHTML=html;
}

function storyPick(i){
  if(!ST) return;
  const c=CH[ST.ch];
  const s=c.scenes[ST.step];
  if(!s || !s.choice) return;
  if(ST.picks[ST.step]!==undefined) return;
  ST.picks[ST.step]=i;
  paintPick(i);
  sfx(((s.choice.actual==='b')?1:0)===i?'ok':'tap');
  buzz(10);
}

/* ---------- quiz ---------- */
function startChapterQuiz(chId){
  const c=CH[chId]; if(!c) return;
  LAST={ mode:'chapter', chId:chId };
  LAST_CH=chId;
  G={
    mode:'chapter', chId:chId, queue:c.quizzes.slice(), idx:0,
    score:0, combo:0, maxCombo:0, hearts:3,
    answered:0, correct:0, locked:false, roundWrong:[],
    limit:0, tEnd:0, raf:0, completed:false, reviewFixed:0
  };
  hideSheet();
  showScreen('quiz');
  renderQuestion();
}

function buildRound(mode){
  if(mode==='daily'){
    const rng=seeded(hashStr('hb-daily-'+todayKey()));
    return shuffle(ALLQ,rng).slice(0,5);
  }
  if(mode==='review'){
    const ids=Object.keys(DATA.wrong).sort(function(a,b){ return (DATA.wrong[b].at||0)-(DATA.wrong[a].at||0); }).slice(0,10);
    return shuffle(ids.map(function(id){ return QIDX[id]?QIDX[id].q:null; }).filter(Boolean));
  }
  return shuffle(ALLQ);
}

function start(mode){
  const qs=buildRound(mode);
  if(!qs.length){
    showToast('📝','복습할 문제가 없어요','먼저 챕터를 읽고 퀴즈를 풀어 보세요.');
    return;
  }
  LAST={ mode:mode, chId:null };
  G={
    mode:mode, chId:null, queue:qs, idx:0,
    score:0, combo:0, maxCombo:0, hearts:3,
    answered:0, correct:0, locked:false, roundWrong:[],
    limit:(mode==='survival'?15:0), tEnd:0, raf:0, completed:false, reviewFixed:0
  };
  hideSheet();
  showScreen('quiz');
  renderQuestion();
}

function modeName(g){
  if(g.mode==='chapter') return 'CH '+CH[g.chId].no+' · '+CH[g.chId].title;
  if(g.mode==='daily') return '오늘의 복습';
  if(g.mode==='survival') return '서바이벌';
  return '오답 복습';
}

function renderQuestion(){
  const q=G.queue[G.idx];
  const surv=G.mode==='survival';
  const qch=CH[q.chId]||CHAPTERS[0];

  let idxHtml='';
  if(G.mode==='chapter'){
    if(q.label) idxHtml+='<span class="lb">'+esc(q.label)+'</span>';
    idxHtml+='<span>질문 '+(G.idx+1)+' / '+G.queue.length+'</span>';
  }else{
    idxHtml='<span>'+(surv?'생존 ':'Q ')+(G.idx+1)+(surv?'':' / '+G.queue.length)+'</span>';
  }
  $('q-index').innerHTML=idxHtml;

  $('q-score').textContent=G.score;
  $('q-text').textContent=q.q;

  const chip=$('q-chip');
  if(G.mode==='chapter'){
    chip.className='chip '+CATS[qch.cat].cls;
    chip.textContent='CH '+qch.no+' · '+qch.unit;
  }else if(G.mode==='daily'){
    chip.className='chip'; chip.textContent='오늘의 복습';
  }else if(G.mode==='survival'){
    chip.className='chip'; chip.textContent='서바이벌';
  }else{
    chip.className='chip '+CATS[qch.cat].cls; chip.textContent='오답 복습';
  }

  const hearts=$('q-hearts');
  if(surv){
    hearts.classList.remove('hidden');
    hearts.innerHTML=heartsHTML();
  }else{
    hearts.classList.add('hidden');
    hearts.innerHTML='';
  }

  const cb=$('q-combo');
  cb.classList.toggle('on',G.combo>=2);
  cb.innerHTML='🔥 '+G.combo;

  const pf=$('q-progress');
  if(surv){
    pf.style.background='linear-gradient(90deg,#3fe0a2,#8ef0c0)';
    pf.style.width='100%';
  }else{
    pf.style.background='';
    pf.style.width=Math.round(G.idx/G.queue.length*100)+'%';
  }

  const box=$('q-choices');
  if(q.type==='ox'){
    box.className='ox-grid';
    box.innerHTML=[0,1].map(function(i){
      return '<button class="ox" data-v="'+q.choices[i]+'" data-i="'+i+'">'+q.choices[i]+
        '<small>'+(i===0?'맞아요':'아니에요')+'</small></button>';
    }).join('');
  }else{
    box.className='choices';
    box.innerHTML=q.choices.map(function(c,i){
      return '<button class="choice" data-i="'+i+'"><span class="key">'+NUM[i]+'</span><span>'+esc(c)+'</span></button>';
    }).join('');
  }

  G.locked=false;
  scrollTop();
  if(surv) startTimer(); else stopTimer();
}

function heartsHTML(){
  let s='';
  for(let i=0;i<3;i++){
    s+='<span class="'+(i<G.hearts?'':'off')+'">'+(i<G.hearts?'❤':'♡')+'</span>';
  }
  return s;
}
function updateHearts(){
  if(!G) return;
  if(G.mode==='survival') $('q-hearts').innerHTML=heartsHTML();
}

function startTimer(){
  stopTimer();
  G.limit=15;
  G.tEnd=performance.now()+G.limit*1000;
  $('timer-track').classList.add('on');
  tickTimer();
}
function stopTimer(){
  if(G && G.raf){ cancelAnimationFrame(G.raf); G.raf=0; }
  const t=$('timer-track'); if(t) t.classList.remove('on');
}
function tickTimer(){
  if(!G||G.locked) return;
  const left=Math.max(0,G.tEnd-performance.now());
  const f=left/(G.limit*1000);
  const tf=$('timer-fill');
  if(tf){
    tf.style.width=(f*100)+'%';
    tf.className='timer-fill'+(f<=0.25?' danger':(f<=0.5?' warn':''));
  }
  if(left<=0){ answer(-1); return; }
  G.raf=requestAnimationFrame(tickTimer);
}

function answer(pick){
  if(!G||G.locked) return;
  G.locked=true;
  if(G.raf){ cancelAnimationFrame(G.raf); G.raf=0; }
  const tt=$('timer-track'); if(tt) tt.classList.remove('on');

  const q=G.queue[G.idx];
  const surv=G.mode==='survival';
  const timedOut=(pick===-1);
  const ok=!timedOut&&pick===q.answer;

  G.answered++;
  let gain=0;
  if(ok){
    G.correct++;
    G.combo++;
    if(G.combo>G.maxCombo) G.maxCombo=G.combo;
    const bonus=Math.min(G.combo-1,5)*20;
    let speed=0;
    if(surv){
      const left=Math.max(0,G.tEnd-performance.now());
      speed=Math.round(left/(G.limit*1000)*50);
    }
    gain=100+bonus+speed;
    G.score+=gain;
  }else{
    G.combo=0;
    if(surv) G.hearts--;
  }

  const btns=Array.prototype.slice.call(document.querySelectorAll('#q-choices button'));
  btns.forEach(function(b,i){
    b.disabled=true;
    if(i===q.answer) b.classList.add('correct');
    else if(i===pick) b.classList.add('wrong');
    else b.classList.add('dim');
  });

  const d=DATA;
  d.total.answered++;
  if(ok) d.total.correct++;
  const cs=d.catStats[CH[q.chId].cat];
  if(cs){ cs.a++; if(ok) cs.c++; }
  d.seen[q.id]=true;
  if(G.maxCombo>d.maxCombo) d.maxCombo=G.maxCombo;
  if(ok){
    if(d.wrong[q.id]) delete d.wrong[q.id];
    if(G.mode==='review'){ d.reviewCorrect++; G.reviewFixed++; }
  }else{
    const prev=d.wrong[q.id];
    d.wrong[q.id]={ n:(prev?prev.n:0)+1, pick:pick, at:Date.now() };
    G.roundWrong.push(q.id);
  }
  save();

  $('q-score').textContent=G.score;
  updateHearts();
  const cb=$('q-combo');
  cb.classList.toggle('on',G.combo>=2);
  cb.innerHTML='🔥 '+G.combo;
  if(ok){
    if(G.combo>=2){
      cb.classList.remove('pop'); void cb.offsetWidth; cb.classList.add('pop');
    }
    floatScore('+'+gain+(G.combo>=3?'  🔥'+G.combo:''));
    sfx(G.combo>=5?'combo':'ok');
    buzz(14);
  }else{
    sfx('no');
    buzz(timedOut?40:30);
  }

  checkAch(true);
  showFeedback(q,pick,ok,timedOut,gain);
}

function floatScore(txt){
  const el=document.createElement('div');
  el.className='float-score';
  el.textContent=txt;
  $('app').appendChild(el);
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },1000);
}

function choiceText(q,i){
  if(i===null||i===undefined||i<0) return '';
  return q.type==='ox' ? q.choices[i] : (NUM[i]+' '+q.choices[i]);
}

function showFeedback(q,pick,ok,timedOut,gain){
  const g=G;
  const chMode=g.mode==='chapter';
  const surv=g.mode==='survival';
  const last=g.idx>=g.queue.length-1;
  const dead=surv&&g.hearts<=0;
  let nextLabel;
  if(chMode) nextLabel=(g.idx>=g.queue.length-1)?'챕터 결과 보기':'다음 선택';
  else if(dead) nextLabel='결과 보기';
  else nextLabel=(last?'결과 보기':'다음 문제');

  let head,answerLine;
  if(ok){
    const sub=chMode ? (g.combo>=3?g.combo+'연속 · 역사와 같은 선택':'역사의 선택과 같습니다')
      : (g.combo>=3?g.combo+'연속 · 콤보 보너스':'좋아요, 감이 오는데요');
    head='<div class="res-ico ok">✓</div><div class="tt">정답입니다<small>'+sub+'</small></div>'+
      '<div class="pts">+'+gain+'</div>';
    answerLine='';
  }else{
    const sub=chMode ? '역사는 다른 쪽을 골랐습니다'
      : (surv&&g.hearts>0?'하트가 하나 줄었어요':'정답을 확인해 보세요');
    head='<div class="res-ico no">✕</div><div class="tt">'+(timedOut?'시간 초과!':'다른 길을 골랐습니다')+
      '<small>'+sub+'</small></div><div class="pts">+0</div>';
    answerLine='<div class="ex-answer">'+(chMode?'역사의 선택':'정답')+' <b>'+esc(choiceText(q,q.answer))+'</b>'+
      (!timedOut&&pick>=0?' · 내 선택 <s>'+esc(choiceText(q,pick))+'</s>':'')+'</div>';
  }

  $('sheet-body').innerHTML=
    '<div class="sheet-head">'+head+'</div>'+
    '<div class="sheet-body">'+
      answerLine+
      '<span class="ex-label">'+(chMode?'역사의 대답':'한 입 해설')+'</span>'+
      '<div class="ex-text">'+esc(q.explain)+'</div>'+
    '</div>'+
    '<button class="btn-next" data-act="next">'+nextLabel+'</button>';

  $('sheet').classList.add('show');
}

function hideSheet(){ $('sheet').classList.remove('show'); }

function nextQuestion(){
  if(!G||!G.locked) return;
  hideSheet();
  const surv=G.mode==='survival';
  const last=G.idx>=G.queue.length-1;

  if(surv){
    if(G.hearts<=0){ finish(true); return; }
    if(last){ G.queue=G.queue.concat(shuffle(ALLQ)); }
    G.idx++;
    renderQuestion();
    return;
  }
  if(last){ finish(true); return; }
  G.idx++;
  renderQuestion();
}

/* ---------- finish ---------- */
function touchStreak(){
  const d=DATA, t=todayKey();
  if(d.streak.last!==t){
    d.streak.count=(d.streak.last===yesterdayKey())?(d.streak.count||0)+1:1;
    d.streak.last=t;
    if(d.streak.count>d.streak.best) d.streak.best=d.streak.count;
  }
}

function finish(completed){
  if(!G) return;
  stopTimer();
  hideSheet();
  const g=G, d=DATA;
  g.completed=!!completed;
  if(g.answered>0){ d.rounds++; touchStreak(); }

  if(g.mode==='chapter') applyChapter();
  else applyRound();
  save();

  g.newAch=checkAch(false);
  if(g.mode==='chapter') renderChapterResult();
  else renderRoundResult();
  showScreen('result');

  const cleared=(g.mode==='chapter'&&g.cleared);
  if(cleared||g.isRecord) confetti();
  sfx(g.completed?'end':'tap');

  if(g.newAch.length){
    g.newAch.forEach(function(a,k){
      setTimeout(function(){ showToast(a.icon,a.name+' 달성!',a.desc); }, 600+k*1400);
    });
  }
}

function applyChapter(){
  const g=G, c=CH[g.chId];
  const rec=chapterRec(c.id);
  const n=c.quizzes.length;
  rec.plays=(rec.plays||0)+1;
  const correct=g.correct;
  let stars=0;
  if(correct>=n) stars=3; else if(correct>=n-1) stars=2; else if(correct>=n-2) stars=1;
  g.stars=stars;
  g.cleared=!!(g.completed && g.answered===n);
  g.prevBest=rec.best||0;
  if(g.cleared){
    rec.cleared=true;
    if(stars>rec.stars) rec.stars=stars;
    if(g.score>rec.best){ rec.best=g.score; }
    if(correct===n) DATA.aces[c.id]=1;
    rec.read=c.scenes.length;
    g.isRecord=(g.prevBest>0 && g.score>g.prevBest);
  }else if(g.answered>0){
    if(g.score>rec.best) rec.best=g.score;
    g.isRecord=false;
  }
}

function applyRound(){
  const g=G, d=DATA;
  const key=(g.mode==='daily'?'daily':(g.mode==='survival'?'survival':'review'));
  const prevBest=d.best[key]||0;
  g.isRecord=(g.answered>0 && g.score>prevBest);
  g.prevBest=prevBest;
  if(g.score>prevBest) d.best[key]=g.score;
  if(g.mode==='survival' && g.answered>d.survBest) d.survBest=g.answered;
  if(g.mode==='daily' && g.answered>=g.queue.length){
    d.dailyDate=todayKey();
    if(g.score>(d.dailyScore||0)) d.dailyScore=g.score;
  }
}

function confetti(){
  const box=$('confetti');
  const colors=['#ffce5c','#ff9d5c','#5cc8ff','#b78dff','#3fe0a2','#ff6b81'];
  let html='';
  for(let i=0;i<44;i++){
    const left=Math.random()*100;
    const delay=Math.random()*0.5;
    const dur=1.6+Math.random()*1.4;
    const size=5+Math.random()*7;
    const col=colors[Math.floor(Math.random()*colors.length)];
    html+='<i style="left:'+left+'%;top:0;width:'+size+'px;height:'+(size*0.6)+'px;background:'+col+
      ';animation-delay:'+delay+'s;animation-duration:'+dur+'s;transform:rotate('+Math.round(Math.random()*180)+'deg)"></i>';
  }
  box.innerHTML=html;
  setTimeout(function(){ box.innerHTML=''; },3400);
}

function renderChapterResult(){
  const g=G, c=CH[g.chId];
  const answered=g.answered, correct=g.correct;
  const cleared=!!g.cleared;
  const nextId=nextChapterId(c.id);
  const newAch=g.newAch||[];
  const unlockHtml=newAch.length?
    '<div class="unlocked"><div class="h">NEW 칭호 · 업적</div>'+
    newAch.map(function(a){
      return '<div class="a"><span>'+a.icon+'</span><span>'+esc(a.name)+(a.title?' <span style="color:var(--dim);font-weight:600">· '+esc(a.title)+'</span>':'')+'</span></div>';
    }).join('')+'</div>':'';

  $('result-body').innerHTML=
    '<div class="clear-wrap">'+
      '<div class="clear-kicker">'+(cleared?'CHAPTER CLEAR':'STORY PAUSED')+'</div>'+
      (cleared
        ? '<div class="clear-badge"><span><span class="em">'+c.emoji+'</span>클리어</span></div>'
        : '<div class="clear-badge miss">중단</div>')+
      '<div class="stars-big">'+starBig(g.stars)+'</div>'+
      '<div class="clear-title">'+esc(c.title)+'</div>'+
      '<div class="clear-sub">'+esc(c.unit)+' · '+correct+'/'+answered+' 정답 · '+g.score+'점</div>'+
      (g.isRecord?'<div class="record">🏅 최고 점수 갱신</div>':'')+
      (cleared?'<div class="clear-learned"><b>이 챕터에서 얻은 것</b>'+esc(c.learned||'')+'</div>':'')+
      unlockHtml+
      '<div class="res-actions">'+
        '<button class="btn-primary" data-act="'+(cleared&&nextId?'next-chapter':'go-home')+'"'+
          (cleared&&nextId?' data-id="'+nextId+'"':'')+'>'+
          (cleared?(nextId?'다음 챕터 →':'홈으로'):'홈으로')+'</button>'+
        '<button class="btn-ghost" data-act="retry-chapter">다시 풀기</button>'+
      '</div>'+
      '<div class="res-note">'+esc(g.roundWrong.length?('틀린 선택 '+g.roundWrong.length+'개는 도감 > 오답에 담겼어요.'):'모든 선택이 역사와 같았습니다.')+'</div>'+
      '<div style="height:18px"></div>'+
    '</div>';
}

function starBig(n){
  n=Math.max(0,Math.min(3,n||0));
  let s='';
  for(let i=0;i<3;i++) s+= i<n?'<span>★</span>':'<span class="off">★</span>';
  return s;
}

function renderRoundResult(){
  const g=G;
  const surv=g.mode==='survival';
  const answered=g.answered, correct=g.correct;
  const acc=answered?Math.round(correct/answered*100):0;
  const title=!g.completed?'중단한 라운드':(surv?'서바이벌 종료':'라운드 완료');
  const sub=modeName(g)+' · '+answered+'문제';
  const newAch=g.newAch||[];
  const unlockHtml=newAch.length?
    '<div class="unlocked"><div class="h">NEW 칭호 · 업적</div>'+
    newAch.map(function(a){
      return '<div class="a"><span>'+a.icon+'</span><span>'+esc(a.name)+(a.title?' <span style="color:var(--dim);font-weight:600">· '+esc(a.title)+'</span>':'')+'</span></div>';
    }).join('')+'</div>':'';

  let note;
  if(!answered) note='다음엔 한 문제라도 골라 봐요.';
  else if(surv) note='최고 '+DATA.survBest+'문제 생존 · 틀린 문제는 오답에 담겼어요.';
  else if(g.roundWrong.length) note='틀린 '+g.roundWrong.length+'문제는 도감 > 오답에 저장했어요.';
  else note='모두 맞혔어요. 다음엔 서바이벌에 도전해 볼까요?';

  $('result-body').innerHTML=
    '<div class="res-wrap">'+
      '<div class="res-kicker">'+esc(title).toUpperCase()+'</div>'+
      '<div class="res-score" id="res-score">0<small>점</small></div>'+
      '<div class="res-mode">'+esc(sub)+'</div>'+
      (g.isRecord?'<div class="record">🏅 '+(g.prevBest>0?'신기록! 이전 최고 '+g.prevBest+'점':'첫 기록 등록!')+'</div>':'')+
      '<div class="res-grid">'+
        '<div class="res-cell"><b class="'+(answered&&correct===answered?'ok':'')+'">'+correct+'/'+answered+'</b><span>정답</span></div>'+
        '<div class="res-cell"><b>'+acc+'%</b><span>정답률</span></div>'+
        '<div class="res-cell"><b>'+g.maxCombo+'</b><span>최고 콤보</span></div>'+
      '</div>'+
      unlockHtml+
      '<div class="res-note">'+esc(note)+'</div>'+
      '<div class="res-actions">'+
        '<button class="btn-primary" data-act="again">다시 도전</button>'+
        '<button class="btn-ghost" data-act="go-home">홈으로</button>'+
      '</div>'+
      '<div style="height:20px"></div>'+
    '</div>';

  const el=$('res-score');
  const target=g.score;
  const t0=performance.now();
  const dur=700;
  function step(t){
    const p=Math.min(1,(t-t0)/dur);
    const e=1-Math.pow(1-p,3);
    el.innerHTML=Math.round(target*e)+'<small>점</small>';
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  setTimeout(function(){ if(el) el.innerHTML=target+'<small>점</small>'; },dur+120);
}

function nextChapterId(id){
  const i=CH[id].order;
  if(i>=0 && i<CHAPTERS.length-1) return CHAPTERS[i+1].id;
  return null;
}

/* ---------- collection ---------- */
function renderCollection(){
  Array.prototype.forEach.call(document.querySelectorAll('#seg button'),function(b){
    b.classList.toggle('on',b.dataset.seg===SEG);
  });
  if(SEG==='wrong') renderWrong();
  else if(SEG==='chapters') renderChapters();
  else if(SEG==='titles') renderTitles();
  else renderStats();
}

function wrongIds(){
  return Object.keys(DATA.wrong).sort(function(a,b){ return (DATA.wrong[b].at||0)-(DATA.wrong[a].at||0); });
}

function renderWrong(){
  const ids=wrongIds().filter(function(id){ return !!QIDX[id]; });
  if(!ids.length){
    $('collection-body').innerHTML=
      '<div class="empty"><span class="i">🎉</span><b>오답이 없어요</b>'+
      '<span>챕터를 읽고 선택을 틀리면 여기에 쌓여요.<br>다시 골라서 하나씩 지워 보세요.</span></div>';
    return;
  }
  const list=ids.slice(0,50).map(function(id){
    const it=QIDX[id];
    const q=it.q, ch=it.ch;
    const w=DATA.wrong[id]||{n:1};
    const myPick=(w.pick!==null&&w.pick!==undefined&&w.pick>=0)?choiceText(q,w.pick):'시간 초과';
    return '<div class="wrong-item">'+
      '<div class="top"><span class="cat '+CATS[ch.cat].cls+'">'+CATS[ch.cat].name+'</span>'+
        '<span style="font-size:10px;color:var(--dim2);font-weight:700;max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(ch.title)+'</span>'+
        '<span class="cnt">'+w.n+'번</span></div>'+
      '<div class="q">'+esc(q.q)+'</div>'+
      '<div class="ans">내 선택 <s>'+esc(myPick)+'</s> · 역사의 선택 <b>'+esc(choiceText(q,q.answer))+'</b></div>'+
      '<div class="ex">'+esc(q.explain)+'</div>'+
    '</div>';
  }).join('');

  $('collection-body').innerHTML=
    '<div class="wrong-head"><span class="n">틀린 선택 '+ids.length+'개</span>'+
      '<button class="btn-ghost" data-act="start" data-mode="review">오답 복습 시작</button></div>'+
    list+
    (ids.length>50?'<p style="text-align:center;color:var(--dim2);font-size:11px;margin:10px 0">최근 50개만 보여요</p>':'');
}

function renderChapters(){
  let html='';
  CAT_ORDER.forEach(function(k){
    const c=CATS[k];
    html+='<div class="section-label" style="margin-top:16px"><h2>'+c.icon+' '+c.name+'</h2>'+
      '<span class="hint">'+catCleared(k)+'/'+catChapters(k).length+'</span></div>';
    CAT_UNITS[k].forEach(function(u){
      html+='<div class="listmeta"><b>'+esc(u.name)+'</b><span>'+unitCleared(u)+'/'+u.chapters.length+'</span></div>';
      u.chapters.forEach(function(ch){
        const r=DATA.chapters[ch.id]||{read:0,cleared:false,stars:0};
        html+='<button class="chap-row'+(r.cleared?' done':'')+'" data-act="chapter" data-id="'+ch.id+'">'+
          '<span class="em">'+ch.emoji+'</span>'+
          '<span class="n">'+esc(ch.title)+'<small>CH '+ch.no+' · '+esc(ch.era)+'</small></span>'+
          '<span class="st">'+(r.cleared?starText(r.stars):(r.read>0?Math.min(r.read,ch.scenes.length)+'/'+ch.scenes.length:'시작'))+'</span>'+
        '</button>';
      });
    });
  });
  $('collection-body').innerHTML=html;
}

function renderTitles(){
  const owned=ACHS.filter(function(a){ return a.title && DATA.ach[a.id]; });
  let html='';
  if(!owned.length){
    html+='<div class="empty" style="padding:24px 16px 28px"><span class="i">🎖️</span><b>아직 칭호가 없어요</b>'+
      '<span>챕터를 하나만 클리어해도 첫 칭호를 받아요.</span></div>';
  }else{
    html+='<div class="title-grid" style="margin-bottom:18px">'+owned.map(function(a){
      const on=DATA.title===a.title;
      return '<button class="title-card'+(on?' on':'')+'" data-act="equip" data-title="'+esc(a.title)+'">'+
        '<span class="i">'+a.icon+'</span><b>'+esc(a.title)+'</b><span>'+esc(a.desc)+'</span>'+
        '<span class="use">'+(on?'✔ 사용 중':'눌러서 착용')+'</span></button>';
    }).join('')+'</div>';
  }
  html+='<div class="section-label" style="margin:4px 2px 11px"><h2>업적 '+Object.keys(DATA.ach).length+' / '+ACHS.length+'</h2></div>';
  html+=ACHS.map(function(a){
    const got=!!DATA.ach[a.id];
    return '<div class="ach '+(got?'on':'locked')+'">'+
      '<span class="i">'+(got?a.icon:'🔒')+'</span>'+
      '<span class="b"><b>'+esc(a.name)+'</b><span>'+esc(a.desc)+'</span></span>'+
      (got?'<span class="ck">✓</span>':'')+
    '</div>';
  }).join('');
  $('collection-body').innerHTML=html;
}

function renderStats(){
  const d=DATA;
  const acc=d.total.answered?Math.round(d.total.correct/d.total.answered*100):0;
  let bars='';
  CAT_ORDER.forEach(function(k){
    const st=d.catStats[k]||{a:0,c:0};
    const r=st.a?Math.round(st.c/st.a*100):0;
    const total=catChapters(k).length;
    bars+='<div class="stat-line '+CATS[k].cls+'">'+
      '<div class="r"><span>'+CATS[k].icon+' '+CATS[k].name+'</span><b>'+catCleared(k)+'/'+total+' 챕터 · '+r+'%</b></div>'+
      '<div class="track"><div class="fill" style="width:'+Math.round(catCleared(k)/total*100)+'%"></div></div></div>';
  });

  $('collection-body').innerHTML=
    '<div class="stat-cards" style="margin-top:16px">'+
      '<div class="sc"><b>'+d.total.answered+'</b><span>누적 푼 문제</span></div>'+
      '<div class="sc"><b>'+acc+'%</b><span>누적 정답률</span></div>'+
      '<div class="sc"><b>'+d.maxCombo+'</b><span>최고 콤보</span></div>'+
      '<div class="sc"><b>'+(d.streak.best||0)+'일</b><span>최장 연속</span></div>'+
    '</div>'+
    '<div class="section-label" style="margin-top:0"><h2>카테고리 진행</h2></div>'+
    bars+
    '<div class="section-label"><h2>최고 점수</h2></div>'+
    '<div class="stat-cards">'+
      '<div class="sc"><b>'+d.best.daily+'</b><span>오늘의 복습</span></div>'+
      '<div class="sc"><b>'+d.best.survival+'</b><span>서바이벌</span></div>'+
      '<div class="sc"><b>'+d.best.review+'</b><span>오답 복습</span></div>'+
      '<div class="sc"><b>'+(d.survBest||0)+'</b><span>서바이벌 최고 생존</span></div>'+
    '</div>'+
    '<div class="section-label"><h2>탐구 기록</h2></div>'+
    '<div class="stat-cards">'+
      '<div class="sc"><b>'+clearedCount()+'</b><span>클리어한 챕터</span></div>'+
      '<div class="sc"><b>'+Object.keys(d.aces).length+'</b><span>만점 챕터</span></div>'+
      '<div class="sc"><b>'+d.rounds+'</b><span>완료한 라운드</span></div>'+
      '<div class="sc"><b>'+Object.keys(d.wrong).length+'</b><span>남은 오답</span></div>'+
    '</div>'+
    '<div style="height:10px"></div>';
}

/* ---------- settings ---------- */
function renderSettings(){
  const s=DATA.sound, v=DATA.vibrate;
  $('settings-body').innerHTML=
    '<div class="set-row"><div class="t"><b>효과음</b><span>정답·오답·장면 넘김 소리를 켜고 꺼요</span></div>'+
      '<button class="sw '+(s?'on':'')+'" data-act="toggle-sound" aria-label="효과음"></button></div>'+
    '<div class="set-row"><div class="t"><b>진동</b><span>답을 고를 때 짧게 진동해요 (안드로이드)</span></div>'+
      '<button class="sw '+(v?'on':'')+'" data-act="toggle-vibrate" aria-label="진동"></button></div>'+
    '<div class="set-row"><div class="t"><b>이야기 구성</b><span>총 '+CHAPTERS.length+'챕터 · 한국사 '+catChapters('kr').length+
      ' · 세계사 '+catChapters('world').length+' · 교양 '+catChapters('culture').length+' · 문제 '+ALLQ.length+'개 · '+UNITS.length+'단원</span></div></div>'+
    '<div class="set-row"><div class="t"><b>저장 방식</b><span>기록은 이 브라우저에만 저장돼요 (localStorage · history-bite-v2)</span></div></div>'+
    '<button class="danger" data-act="reset">모든 기록 지우기</button>'+
    '<div class="about"><b>역사 한 입</b> · 한 시대의 주인공이 되어 장면을 읽고, 선택으로 퀴즈를 푸는 이야기 게임.<br>'+
      '정답은 “그때 실제로 일어난 일”이에요. 틀려도 괜찮아요. 역사가 무엇을 골랐는지 알면 그것이 공부니까요.<br><br>'+
      '정우 님을 위해 만든 개인용 게임이에요. 🍽️</div>'+
    '<div style="height:16px"></div>';
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  const m=e.target.closest('[data-m]');
  if(m){
    $('modal-bg').classList.remove('show');
    const r=modalResolve; modalResolve=null;
    if(r) r(m.dataset.m==='1');
    return;
  }

  const tab=e.target.closest('[data-tab]');
  if(tab){
    sfx('tap');
    if(tab.dataset.tab==='home'){ renderHome(); showScreen('home'); }
    else if(tab.dataset.tab==='collection'){ renderCollection(); showScreen('collection'); }
    else { renderSettings(); showScreen('settings'); }
    return;
  }

  const el=e.target.closest('[data-act]');
  if(!el) return;
  const act=el.dataset.act;

  if(act==='home-cat'){
    sfx('tap');
    DATA.homeCat=el.dataset.cat;
    DATA.ux.open={};
    save(); renderHome();
  }
  else if(act==='filter'){
    sfx('tap');
    DATA.ux.filter=el.dataset.f;
    save();
    Array.prototype.forEach.call(document.querySelectorAll('.fbtn'),function(b){
      b.classList.toggle('on',b.dataset.f===DATA.ux.filter);
    });
    renderHomeList();
  }
  else if(act==='unit'){
    const id=el.dataset.id;
    const unit=document.querySelector('.unit[data-unit="'+id+'"]');
    const open=unit && !unit.classList.contains('open');
    DATA.ux.open[id]=open;
    save();
    if(unit) unit.classList.toggle('open',open);
    sfx('tap');
  }
  else if(act==='chapter'){
    sfx('tap');
    openChapter(el.dataset.id);
  }
  else if(act==='story-pick'){
    storyPick(Number(el.dataset.i));
  }
  else if(act==='start'){
    sfx('tap');
    start(el.dataset.mode);
  }
  else if(act==='next'){ nextQuestion(); }
  else if(act==='again'){
    if(LAST.mode==='chapter' && LAST.chId) startChapterQuiz(LAST.chId);
    else start(LAST.mode);
  }
  else if(act==='retry-chapter'){
    const id=LAST.chId||LAST_CH;
    if(id) startChapterQuiz(id); else exitStory();
  }
  else if(act==='next-chapter'){
    const id=el.dataset.id;
    if(id){ openChapter(id); }
    else { renderHome(); showScreen('home'); }
  }
  else if(act==='go-home'){
    G=null; ST=null; renderHome(); showScreen('home');
    const hs=$('screen-home'); if(hs) hs.scrollTop=HOME_SCROLL;
  }
  else if(act==='toggle-sound'){
    DATA.sound=!DATA.sound; save(); renderSettings();
    if(DATA.sound) sfx('tap');
  }
  else if(act==='toggle-vibrate'){
    DATA.vibrate=!DATA.vibrate; save(); renderSettings(); buzz(20);
  }
  else if(act==='reset'){
    confirmModal({
      title:'모든 기록을 지울까요?',
      desc:'최고 점수, 클리어한 챕터, 오답, 칭호가 모두 사라져요. 되돌릴 수 없습니다.',
      ok:'지우기', cancel:'취소', danger:true
    }, function(yes){
      if(!yes) return;
      DATA=deep(DEFAULT);
      save();
      G=null; ST=null;
      renderHome(); renderSettings(); showScreen('settings');
      showToast('🗑️','기록을 지웠어요','처음부터 다시 시작해요.');
    });
  }
  else if(act==='equip'){
    DATA.title=el.dataset.title; save();
    renderTitles();
    showToast('🎖️','칭호를 착용했어요',DATA.title);
  }
});

document.addEventListener('input',function(e){
  if(e.target && e.target.id==='hb-q'){
    DATA.ux.q=e.target.value;
    save();
    renderHomeList();
  }
});

$('q-choices').addEventListener('click',function(e){
  const b=e.target.closest('button'); if(!b) return;
  answer(Number(b.dataset.i));
});

$('seg').addEventListener('click',function(e){
  const b=e.target.closest('[data-seg]'); if(!b) return;
  SEG=b.dataset.seg;
  sfx('tap');
  renderCollection();
});

$('btn-quit').addEventListener('click',function(){
  if(!G) return;
  confirmModal({
    title:(G.mode==='chapter'?'이야기를 나갈까요?':'그만둘까요?'),
    desc:(G.mode==='chapter'?'지금까지 고른 문제로 결과를 볼 수 있어요. 틀린 선택은 오답에 남습니다.':'지금까지 푼 문제의 점수로 라운드가 끝나요. 오답은 노트에 남습니다.'),
    ok:'나가기', cancel:'계속하기'
  }, function(yes){ if(yes) finish(false); });
});

$('btn-story-back').addEventListener('click',function(){
  sfx('tap');
  exitStory();
});
$('btn-story-next').addEventListener('click',function(){ storyNext(); });
$('btn-story-prev').addEventListener('click',function(){ storyPrev(); });

/* 스와이프로 장면 넘기기 */
(function(){
  const stage=$('story-stage');
  let sx=0, sy=0, moved=false;
  stage.addEventListener('touchstart',function(e){
    if(!e.touches||!e.touches[0]) return;
    sx=e.touches[0].clientX; sy=e.touches[0].clientY; moved=false;
  },{passive:true});
  stage.addEventListener('touchmove',function(e){
    if(!e.touches||!e.touches[0]) return;
    const dx=e.touches[0].clientX-sx, dy=e.touches[0].clientY-sy;
    if(Math.abs(dx)>18 && Math.abs(dx)>Math.abs(dy)) moved=true;
  },{passive:true});
  stage.addEventListener('touchend',function(e){
    if(!e.changedTouches||!e.changedTouches[0]) return;
    const dx=e.changedTouches[0].clientX-sx;
    if(Math.abs(dx)>56 && moved){ if(dx<0) storyNext(); else storyPrev(); }
  },{passive:true});
})();

$('btn-sound-home').addEventListener('click',function(){
  DATA.sound=!DATA.sound; save();
  this.textContent=DATA.sound?'🔊':'🔇';
  if(DATA.sound) sfx('tap');
  if(SCREEN==='settings') renderSettings();
});

document.addEventListener('keydown',function(e){
  if(SCREEN==='story'&&ST){
    if(e.key==='ArrowRight'||e.key==='Enter'){ e.preventDefault(); storyNext(); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); storyPrev(); }
    else if(e.key==='Escape'){ exitStory(); }
    return;
  }
  if(SCREEN!=='quiz'||!G) return;
  if(G.locked){
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); nextQuestion(); }
    return;
  }
  if(e.key==='Enter'){
    e.preventDefault();
    const n=document.querySelectorAll('#q-choices button').length;
    if(n===2) answer(0);
    return;
  }
  const n=Number(e.key);
  const total=document.querySelectorAll('#q-choices button').length;
  if(n>=1&&n<=total){ e.preventDefault(); answer(n-1); }
});

/* ---------- boot ---------- */
function boot(){
  if(DATA.ux) DATA.ux.q='';
  const sb=$('btn-sound-home');
  if(sb) sb.textContent=DATA.sound?'🔊':'🔇';
  renderHome();
  renderSettings();
  showScreen('home');
  if(DATA.legacy && !DATA.legacy.shown){
    DATA.legacy.shown=true; save();
    setTimeout(function(){
      showToast('🔄','이전 기록을 옮겼어요','15챕터 기록 중 '+DATA.legacy.chapters+'개를 150챕터에 이어 붙였습니다.');
    },900);
  }
}
document.addEventListener('DOMContentLoaded',boot);
if(document.readyState!=='loading') boot();

window.__HB={
  DATA:function(){ return DATA; },
  CHAPTERS:CHAPTERS, CH:CH, CATS:CATS, UNITS:UNITS, ALLQ:ALLQ, ACHS:ACHS,
  state:function(){ return {screen:SCREEN, G:G, ST:ST}; },
  openChapter:openChapter, startChapterQuiz:startChapterQuiz, start:start,
  renderHome:renderHome, resumeChapter:resumeChapter
};

</script>
</body>
</html>
